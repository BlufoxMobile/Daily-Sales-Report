name: Build t-sheet counts

# Calls the Apps Script submissions feed ONCE for the whole company and commits a
# small counts file the quote sheets read from GitHub Pages. This replaces every
# sheet calling Apps Script directly, which was starving the submission endpoint.
#
# The same run also commits data/tsheet-flags.json — today's rapid-fire clusters,
# which need per-submission timestamps the counts file does not carry. This runner
# is the only machine that can reach the feed, so it computes them here. The two
# files carry a shared run_id and the builder writes them together or not at all;
# they must therefore be committed together too, in ONE commit, or a consumer can
# fetch a matched pair from Pages only after both have landed.
#
# ...and data/tsheet-digest.json — the SIX DIGEST EMAILS, fully rendered, with the
# send slot and the data-age element left as placeholders. The 12:00/3:00/6:00
# send runs on Zapier, whose only place to put code is an unversioned textarea in
# a web UI; rendering here instead makes the Zap a fetch, a few sanity checks and
# two string substitutions, and keeps the 100 KB of renderer in this repo where it
# can be reviewed and diffed. See scripts/tsheet-digest.js and
# scripts/DIGEST-CONTRACT.md.
#
# The digest is rendered from the counts and flags files ON DISK — the bytes this
# run just wrote, before they are pushed. Over the network it would be wrong twice
# over: GitHub Pages can sit most of a day behind main (it only redeploys when
# update.yml runs), and raw.githubusercontent cannot serve a commit that has not
# happened yet. So the Action would render the PREVIOUS run's numbers and commit
# them beside this run's counts, under this run's run_id — three files that claim
# to agree and do not. On disk is the only way they actually do.
#
# All three files therefore carry ONE run_id and are committed in ONE commit.
#
# WHY THIS RUNS IN A LOOP RATHER THAN ON THE CRON
# -----------------------------------------------
# The cron used to say `*/10 * * * *`. GitHub honoured roughly one firing in
# twenty. Measured 2026-09-04, the only scheduled runs all day were 12:51 AM,
# 6:02 AM, 9:56 AM and 1:16 PM Central -- about every three and a half hours.
# GitHub de-prioritises high-frequency schedules and says so in its docs; the
# more often you ask, the more it drops. So at noon the dashboard was showing
# 15 t-sheets from the 9:57 AM build when the real number was near 150, and the
# rep-facing panel on the quote sheets was hours behind on every store.
#
# Asking more often makes it worse, so this asks LESS often and then stays
# resident: each firing rebuilds every REFRESH_SECONDS until the shop day ends.
# One honoured trigger now covers the rest of the day instead of one moment of
# it. `cancel-in-progress: true` means a newer firing simply takes over.
on:
  schedule:
    # Hourly, at :07 -- deliberately NOT on the hour, which is the busiest slot
    # on GitHub's scheduler and the most likely to be dropped. 11:00-03:00 UTC
    # is 6 AM - 10 PM Central, the only hours the numbers move.
    - cron: '7 11-23,0-3 * * *'
  workflow_dispatch:          # lets you run it on demand from the Actions tab

# Least privilege: this job only needs to push the data files.
permissions:
  contents: write

concurrency:
  group: tsheet-counts
  # A fresh trigger should replace a resident loop, not queue behind it. The
  # loop only ever holds an unpushed commit for a moment, so cancelling it is
  # safe -- the next run rebuilds from the feed anyway.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The loop below stops itself at the end of the shop day; this is only a
    # backstop so a wedged run can never sit on the concurrency group forever.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ONE RESIDENT STEP. The three things that used to be separate steps --
      # build the counts, render the digest, commit if anything moved -- now run
      # together once every REFRESH_SECONDS until STOP_HOUR_UTC.
      #
      # Failure handling, per cycle, deliberately asymmetric:
      #   feed unreadable  -> warn, keep the counts already on disk, carry on.
      #     The Apps Script endpoint 404s on roughly one call in five (Google's
      #     problem; it clears itself). The digest still renders from the last
      #     good numbers, the age line says how old they are, the subject gains
      #     "[Data 3 hours old]" past 90 minutes, and the Zapier step refuses
      #     outright to mail a digest whose `day` is not today.
      #   digest render fails -> log an error and carry on. A bad render must
      #     not stop the counts refreshing for the rest of the day.
      #   push fails -> drop the local commit; next cycle rebuilds and re-pushes.
      # Nothing in a single cycle is allowed to end the loop.
      #
      # WHY EVERY CYCLE STARTS WITH A HARD RESET, AND WHY THERE IS NO REBASE
      # -------------------------------------------------------------------
      # On 2026-09-04 this loop stopped committing at 1:33 PM and sat there,
      # alive but silent, until a scheduled run cancelled it at 2:58 PM -- 85
      # minutes of a dashboard Jeff watches showing numbers that had stopped
      # moving, with no red X anywhere to say so. The likely culprit was the
      # `git pull --rebase` that used to live in the push block: a rebase can
      # stop and wait for a human, and there is no human on a runner.
      #
      # There is nothing here worth merging. All three data files are generated
      # from the feed every cycle and never hand-edited, so the correct response
      # to "origin moved" is not to reconcile, it is to throw away whatever is
      # local and rebuild. Each cycle therefore begins at origin/main exactly,
      # and a commit that fails to push is simply discarded -- the next cycle
      # regenerates it five minutes later from fresher numbers anyway.
      #
      # Every command that touches the network or the feed is wrapped in
      # `timeout` for the same reason: a cycle may fail, but it may not hang.
      - name: Refresh counts, flags and digest until the shop day ends
        env:
          FEED_URL: ${{ secrets.TSHEET_FEED_URL }}
          REFRESH_SECONDS: '300'   # 5 minutes
          STOP_HOUR_UTC: '3'       # 10 PM Central
          FEED_TIMEOUT: '240'      # the feed returns ~14k rows; 15-40s normal
          RENDER_TIMEOUT: '120'
          GIT_TIMEOUT: '90'
        run: |
          set -uo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cycle=0
          while :; do
            cycle=$(( cycle + 1 ))
            echo "::group::cycle $cycle - $(date -u '+%H:%M:%SZ')"

            # Start from origin/main, always. Discards a commit an earlier
            # cycle could not push and any drift the runner picked up. Safe
            # because all three data files are generated, never authored.
            if timeout "$GIT_TIMEOUT" git fetch --quiet --force origin main:refs/remotes/origin/main; then
              git reset --hard --quiet origin/main
            else
              echo "::warning::cycle $cycle: could not fetch origin; working from the local tree"
            fi

            if timeout "$FEED_TIMEOUT" node scripts/build-tsheet-counts.js; then
              :
            else
              echo "::warning::cycle $cycle: the submissions feed could not be read; keeping the counts already on disk"
            fi

            if timeout "$RENDER_TIMEOUT" node scripts/tsheet-digest.js \
                 --emit-digest --source=local \
                 --counts-file=data/tsheet-counts.json \
                 --flags-file=data/tsheet-flags.json \
                 --directory-file=data/store-directory.json \
                 --digest-out=data/tsheet-digest.json \
                 --skip-if-current; then
              :
            else
              echo "::error::cycle $cycle: the digest failed to render"
            fi

            # JOINT detection over all THREE files. Any one of them moving
            # commits all three, so a consumer can never fetch a mismatched
            # set: the digest's run_id always names the counts and flags
            # beside it.
            if [[ -n "$(git status --porcelain data/tsheet-counts.json data/tsheet-flags.json data/tsheet-digest.json)" ]]; then
              git add data/tsheet-counts.json data/tsheet-flags.json data/tsheet-digest.json
              git commit -m "chore: refresh t-sheet counts + rapid-fire flags + digest [skip ci]"
            else
              echo "no change this cycle"
            fi

            # Push it. No rebase: the cycle started at origin/main, so a
            # rejected push means origin moved underneath us in the last few
            # seconds, and the right answer is to let the next cycle rebuild
            # on top of whatever landed -- not to reconcile two generated
            # files. The reset at the top of the next cycle drops this commit.
            if [[ -n "$(git log --oneline origin/main..HEAD 2>/dev/null)" ]]; then
              if timeout "$GIT_TIMEOUT" git push; then
                echo "pushed"
              else
                echo "::warning::cycle $cycle: push rejected or timed out; next cycle rebuilds from origin"
              fi
            fi
            echo "::endgroup::"

            # Stop at the end of the shop day. The next morning's cron picks it
            # up again; nothing needs to run overnight.
            hour_utc=$(( 10#$(date -u +%H) ))
            if [[ $hour_utc -ge $STOP_HOUR_UTC && $hour_utc -lt 11 ]]; then
              echo "past ${STOP_HOUR_UTC}:00 UTC - stopping until the morning schedule"
              break
            fi

            sleep "$REFRESH_SECONDS"
          done
