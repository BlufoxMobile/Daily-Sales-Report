name: Build t-sheet counts

# Calls the Apps Script submissions feed ONCE for the whole company and commits a
# small counts file the quote sheets read from GitHub Pages. This replaces every
# sheet calling Apps Script directly, which was starving the submission endpoint.
on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (GitHub may delay under load)
  workflow_dispatch:          # lets you run it on demand from the Actions tab

# Least privilege: this job only needs to push the one data file.
permissions:
  contents: write

concurrency:
  group: tsheet-counts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build counts file
        env:
          FEED_URL: ${{ secrets.TSHEET_FEED_URL }}
        run: node scripts/build-tsheet-counts.js

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain data/tsheet-counts.json)" ]]; then
            echo "no change to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tsheet-counts.json
          git commit -m "chore: refresh t-sheet counts [skip ci]"
          # The schedule can overlap a manual run; rebase rather than fail.
          git pull --rebase --autostash
          git push
