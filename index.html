<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cook County Cooks - Daily Sales Report</title>
<!-- Perf (2026-09-24): SheetJS is no longer loaded up front (316 KB download,
     ~150-190 ms of main-thread script evaluation on every open). The report
     now reads the prebuilt data/sales-report.json and loads SheetJS on demand
     (loadSheetJS) only when that file is missing or stale, or for "load a
     local Excel file". See PREBUILT WORKBOOK ROWS in the script below.
     (2026-09-02 had made this script `defer` so a hung cdnjs could not leave
     the page blank; loading on demand keeps that property.) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Perf (2026-09-02): media="print" + onload swap makes the Google Fonts CSS
     non-render-blocking, so a slow/hung fonts.googleapis.com can no longer
     hold up first paint (Archivo swaps in when it arrives; fallback is the
     system sans in the body font stack). -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* ============================================================
   COOK COUNTY COOKS — DAILY SALES REPORT · "BROADCAST ARENA"
   Redesign 2026-09-25. Dark sports-broadcast look for the store
   TVs: condensed Archivo, one vivid accent that still changes
   every day, stinger wipes between slides, kinetic entrances and
   scoreboard count-ups.
   The canvas is 1920 px wide and 1080-1440 px tall (it follows the
   screen's shape, so a 16:10 or 4:3 screen is filled instead of
   letterboxed), scaled to fit. There is no top header any more:
   each slide carries its own title, and the old header's facts
   (brand, store count, updated time, live/paused, day, clock)
   live in the slim ticker along the bottom. The district tabs and
   slide controls rise out of the ticker when a mouse or finger
   moves, and tuck away again when nobody is touching the screen.
   All motion is transform/opacity only, so a store TV's browser
   keeps up; prefers-reduced-motion drops the stingers.
   ============================================================ */
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  /* Day accent — set by applyDayColor() */
  --acc:  #2EE68A;
  --acc2: #1FD1FF;
  --acc-ink: #03130A;       /* text on an accent plate */
  --acc-rgb: 46,230,138;
  /* Ground + plates */
  --bg0: #04060B;
  --bg1: #080C16;
  --pl:  #0D1320;
  --pl2: #121A2B;
  --pl3: #1A2439;
  --ln:  rgba(255,255,255,.07);
  --ln2: rgba(255,255,255,.14);
  /* Type */
  --ink: #F3F5FA;
  --mut: #9AA4B8;
  --dim: #5E6880;
  /* Status */
  --good: #34E08A; --good-rgb: 52,224,138;
  --warn: #FFB224; --warn-rgb: 255,178,36;
  --low:  #FF4D5E; --low-rgb: 255,77,94;
  --gold-a: #FFE9A6; --gold-b: #FFC933; --gold-c: #D08A00; --gold-ink: #3A2400;
  /* Motion */
  --ease: cubic-bezier(.16,1,.3,1);
  --ease-back: cubic-bezier(.34,1.56,.64,1);
  --ease-in: cubic-bezier(.64,0,.78,0);
  --sh: 1080px;
  --fx: 'Archivo', 'Roboto Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
}

html, body { height:100%; overflow:hidden; background:var(--bg0); }
body {
  font-family: var(--fx);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-synthesis: none;
}

/* ---------- STAGE ---------- */
#stage { position:fixed; inset:0; overflow:hidden; background:var(--bg0); }
#stage-scaler {
  width:1920px; height:var(--sh);
  position:absolute; top:50%; left:50%;
  transform: translate(-50%,-50%) scale(1);
  transform-origin: center center;
  overflow:hidden;
  background: var(--bg1);
}
#app { position:absolute; inset:0; z-index:2; }

/* ---------- BACKGROUND: arena lights ---------- */
#bg { position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 120%, rgba(var(--acc-rgb),.10), transparent 60%),
    linear-gradient(180deg, #070B14 0%, #05080F 55%, #03050A 100%);
}
.bg-glow { position:absolute; width:1500px; height:1500px; border-radius:50%;
  background: radial-gradient(closest-side, rgba(var(--acc-rgb),.16), rgba(var(--acc-rgb),.05) 55%, transparent 72%);
  will-change: transform; }
.bg-glow.g1 { left:-620px; top:-760px; animation: glowA 38s ease-in-out infinite alternate; }
.bg-glow.g2 { right:-700px; bottom:-900px; animation: glowB 44s ease-in-out infinite alternate;
  background: radial-gradient(closest-side, rgba(255,255,255,.05), transparent 70%); }
@keyframes glowA { to { transform: translate(260px,180px) scale(1.12); } }
@keyframes glowB { to { transform: translate(-240px,-160px) scale(.92); } }

/* sweeping stadium light beams */
.bg-beams { position:absolute; inset:-20% -10%; }
.bg-beams i { position:absolute; top:0; bottom:0; width:260px; left:-20%;
  background: linear-gradient(90deg, transparent, rgba(var(--acc-rgb),.07) 45%, rgba(255,255,255,.05) 50%, rgba(var(--acc-rgb),.07) 55%, transparent);
  transform: skewX(-24deg); will-change: transform;
  animation: beam 26s linear infinite; }
.bg-beams i:nth-child(2) { width:120px; animation-duration: 34s; animation-delay: -12s; opacity:.8; }
.bg-beams i:nth-child(3) { width:420px; animation-duration: 47s; animation-delay: -30s; opacity:.55; }
@keyframes beam { from { transform: translateX(0) skewX(-24deg); } to { transform: translateX(2900px) skewX(-24deg); } }

/* LED-board dot texture + perspective floor lines */
.bg-dots { position:absolute; inset:0;
  background-image: radial-gradient(rgba(255,255,255,.045) 1px, transparent 1.6px);
  background-size: 6px 6px; }
.bg-floor { position:absolute; left:-30%; right:-30%; bottom:-6%; height:46%;
  background:
    repeating-linear-gradient(90deg, rgba(var(--acc-rgb),.10) 0 2px, transparent 2px 120px),
    repeating-linear-gradient(0deg, rgba(var(--acc-rgb),.08) 0 2px, transparent 2px 80px);
  transform: perspective(700px) rotateX(64deg);
  transform-origin: 50% 100%;
  -webkit-mask-image: linear-gradient(0deg, rgba(0,0,0,.9), transparent 88%);
          mask-image: linear-gradient(0deg, rgba(0,0,0,.9), transparent 88%);
  animation: floor 5s linear infinite; }
@keyframes floor { to { background-position: 0 0, 0 80px; } }

/* giant outlined watermark word behind each slide */
.bg-mark { position:absolute; left:0; right:0; bottom:40px; white-space:nowrap;
  font-size:420px; font-weight:900; font-stretch:62.5%; line-height:.8; letter-spacing:-.02em;
  color: transparent; -webkit-text-stroke: 2px rgba(255,255,255,.045);
  text-transform:uppercase; transition: opacity .6s ease; will-change: transform;
  animation: markDrift 60s ease-in-out infinite alternate; }
.bg-mark.swap { opacity:0; }
@keyframes markDrift { from { transform: translateX(40px); } to { transform: translateX(-520px); } }

/* ---------- SLIDE FRAME ---------- */
#slideHost { position:absolute; inset:0; }
.slide { position:absolute; left:28px; right:28px; top:22px; bottom:62px; display:flex; flex-direction:column; }
.slide.m-soft { animation: softIn .55s var(--ease) both; }
@keyframes softIn { from { opacity:0; } to { opacity:1; } }
.sb { flex:1; min-height:0; position:relative; }

/* Slide header strip: accent kicker plate + big title + sub */
.sh { height:62px; flex:none; display:flex; align-items:center; gap:22px; margin-bottom:16px; min-width:0; }
.kick { isolation:isolate; flex:none; height:48px; display:flex; align-items:center; padding:0 26px 0 22px; position:relative;
  font-size:24px; font-weight:900; font-stretch:75%; letter-spacing:.06em; text-transform:uppercase;
  color: var(--acc-ink); }
.kick::before { content:''; position:absolute; inset:0; background: linear-gradient(100deg, var(--acc), var(--acc2));
  transform: skewX(-14deg); z-index:-1; box-shadow: 0 8px 30px rgba(var(--acc-rgb),.35); }
.kick.ghost { color:var(--ink); }
.kick.ghost::before { background: var(--pl3); box-shadow:none; }
.sh-title { flex:0 0 auto; max-width:1100px; font-size:56px; font-weight:900; font-stretch:62.5%; text-transform:uppercase; line-height:1;
  letter-spacing:.01em; white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.sh-title em { font-style:normal; color:var(--mut); font-weight:800; }
.sh-sub { margin-left:auto; flex:1 1 0; min-width:0; font-size:22px; font-weight:600; color:var(--mut);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:right; }
.sh-sub b { color:var(--ink); font-weight:800; }

/* shared label style */
.lbl { font-size:16px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--mut); white-space:nowrap; }
.num { font-weight:900; font-stretch:62.5%; font-variant-numeric: tabular-nums lining-nums; font-feature-settings:'tnum' 1, 'lnum' 1; letter-spacing:-.01em; white-space:nowrap; }
.num small, .sml { font-size:.55em; font-weight:800; letter-spacing:0; margin-left:.04em; }
.fit { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.tri { display:inline-block; width:.62em; height:.5em; fill:currentColor; vertical-align:.08em; margin-right:.22em; }
.tri.dn { transform: rotate(180deg); }

/* plates */
.plate { background: linear-gradient(180deg, rgba(26,36,57,.72), rgba(13,19,32,.86)); position:relative;
  box-shadow: inset 0 0 0 1px var(--ln), 0 18px 40px rgba(0,0,0,.35); }
.plate::after { content:''; position:absolute; left:0; top:0; height:3px; width:110px;
  background: linear-gradient(90deg, var(--acc), transparent); }
.cut { clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 30px, 100% 100%, 0 100%); }

/* ---------- RANK MEDALLIONS ---------- */
.med { display:inline-flex; align-items:center; justify-content:center; flex:none; border-radius:50%;
  font-weight:900; font-stretch:75%; line-height:1; position:relative; color:#2B1B00;
  background: radial-gradient(circle at 32% 28%, #FFF6CF 0%, #FFD24A 38%, #C98A00 100%);
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.35), 0 6px 18px rgba(255,190,40,.35); }
.med.m2 { color:#1E2430; background: radial-gradient(circle at 32% 28%, #FFFFFF 0%, #D5DBE6 40%, #7F8A9E 100%); box-shadow: inset 0 0 0 3px rgba(255,255,255,.4), 0 6px 18px rgba(200,210,230,.25); }
.med.m3 { color:#2A1206; background: radial-gradient(circle at 32% 28%, #FFE1C4 0%, #E59A5C 42%, #8E4A1C 100%); box-shadow: inset 0 0 0 3px rgba(255,255,255,.3), 0 6px 18px rgba(229,154,92,.3); }
.rkn { font-weight:900; font-stretch:62.5%; color:#C3CADA; font-variant-numeric:tabular-nums; white-space:nowrap; line-height:1; }
.rkn em { font-style:normal; font-size:.6em; color:var(--dim); margin-right:.04em; vertical-align:.28em; }
.star { width:.8em; height:.8em; fill: var(--acc); vertical-align:-.06em; margin-left:.3em; flex:none; }
.crown { width:1em; height:.82em; flex:none; filter: drop-shadow(0 3px 4px rgba(80,50,0,.35)); animation: crown 4.5s ease-in-out infinite; }
@keyframes crown { 0%,100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-8%) rotate(5deg); } }

/* ---------- STATUS TILES (KPIs) ---------- */
.kpi { position:relative; display:flex; flex-direction:column; justify-content:center; min-width:0;
  background: rgba(255,255,255,.035); box-shadow: inset 0 0 0 1px var(--ln); padding:0 14px 0 20px; overflow:hidden; }
.kpi::before { content:''; position:absolute; left:0; top:0; bottom:0; width:6px; background: var(--dim); }
.kpi .kl { font-size:15px; font-weight:800; letter-spacing:.12em; color:var(--mut); text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.kpi .kv { font-size:40px; line-height:1.02; margin-top:2px; color:var(--ink); }
.kpi.s-good::before { background: var(--good); box-shadow: 0 0 18px rgba(var(--good-rgb),.7); }
.kpi.s-good .kv { color: var(--good); }
.kpi.s-warn::before { background: var(--warn); box-shadow: 0 0 18px rgba(var(--warn-rgb),.6); }
.kpi.s-warn .kv { color: var(--warn); }
.kpi.s-low::before { background: var(--low); box-shadow: 0 0 18px rgba(var(--low-rgb),.7); }
.kpi.s-low .kv { color: var(--low); }
.kpi.s-low { background: linear-gradient(90deg, rgba(var(--low-rgb),.13), rgba(255,255,255,.03) 70%); }
.kpi.s-acc::before { background: var(--acc); }

/* ---------- DELTA PLATE (vs goal) ---------- */
.delta { isolation:isolate; display:inline-flex; align-items:center; gap:.1em; white-space:nowrap; font-weight:900; font-stretch:75%;
  padding:.18em .55em .16em; position:relative; font-variant-numeric:tabular-nums; }
.delta::before { content:''; position:absolute; inset:0; transform:skewX(-12deg); z-index:-1; }
.delta small { font-size:.62em; font-weight:800; letter-spacing:.08em; margin-left:.35em; opacity:.85; }
.delta.up { color: var(--good); } .delta.up::before { background: rgba(var(--good-rgb),.14); box-shadow: inset 0 0 0 2px rgba(var(--good-rgb),.45); }
.delta.dn { color: var(--low); }  .delta.dn::before { background: rgba(var(--low-rgb),.14); box-shadow: inset 0 0 0 2px rgba(var(--low-rgb),.45); }

/* ---------- GOAL BAR ---------- */
.goal-track { position:relative; height:18px; background: rgba(255,255,255,.07); overflow:hidden;
  clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
.goal-track > i { position:absolute; left:0; top:0; bottom:0; width:100%; transform-origin:left center;
  transform: scaleX(var(--p,0)); background: linear-gradient(90deg, var(--acc2), var(--acc)); }
.goal-track.over > i { background: linear-gradient(90deg, var(--acc), #fff 160%); }
.goal-track > i::after { content:''; position:absolute; inset:0;
  background: repeating-linear-gradient(-60deg, rgba(255,255,255,.16) 0 8px, transparent 8px 18px);
  animation: stripes 1.2s linear infinite; }
@keyframes stripes { from { background-position:0 0; } to { background-position: 41.6px 0; } }
.goal-meta { display:flex; justify-content:space-between; align-items:baseline; margin-top:8px; }
.goal-meta span { font-size:17px; font-weight:800; letter-spacing:.1em; color:var(--mut); text-transform:uppercase; }
.goal-meta b { font-size:28px; font-weight:900; font-stretch:62.5%; font-variant-numeric:tabular-nums; }
.goal-meta b small { font-size:.62em; letter-spacing:.08em; color:var(--mut); margin-left:.3em; }
.goal-meta b.over { color: var(--acc); }

/* ---------- STORE OVERVIEW (3 x 2) ---------- */
.sgrid { display:grid; grid-template-columns:repeat(3, 1fr); grid-template-rows:repeat(2, 1fr); gap:18px; height:100%; }
.sc { padding:22px 26px 22px; display:flex; flex-direction:column; min-height:0; min-width:0; }
.sc-top { display:flex; align-items:center; gap:16px; min-width:0; }
.sc-top .med { width:66px; height:66px; font-size:34px; }
.sc-top .rkn { font-size:50px; width:92px; text-align:left; color:var(--acc); }
.sc-id { min-width:0; flex:1; }
.sc-name { font-size:calc(52px + (var(--sh) - 1080px) * .03); font-weight:900; font-stretch:62.5%; text-transform:uppercase; line-height:.95; }
.sc-sm { font-size:18px; font-weight:700; color:var(--mut); margin-top:5px; letter-spacing:.02em; }
.sc-sm b { color:var(--ink); font-weight:800; }
.sc-gp { display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin-top:14px; }
.sc-money { font-size:calc(104px + (var(--sh) - 1080px) * .04); line-height:.86; color:var(--ink); }
.sc-gp .delta { font-size:26px; margin-bottom:10px; }
.sc .goal { margin-top:16px; }
.sc-kpis { display:grid; grid-template-columns:repeat(4, 1fr); grid-template-rows:repeat(2, 1fr); gap:8px; margin-top:auto; padding-top:16px; flex:1; max-height:calc(176px + (var(--sh) - 1080px) * .45); }
.sc-kpis .kpi { padding:0 8px 0 16px; }
.sc-kpis .kpi .kl { font-size:13px; letter-spacing:.08em; }
.sc-kpis .kpi .kv { font-size:calc(36px + (var(--sh) - 1080px) * .03); }
.sc.filler { background: repeating-linear-gradient(-45deg, rgba(255,255,255,.025) 0 14px, transparent 14px 28px);
  box-shadow: inset 0 0 0 1px var(--ln); display:flex; align-items:center; justify-content:center; }
.sc.filler::after { display:none; }
.sc.filler img { width:130px; height:130px; border-radius:50%; opacity:.28; filter: grayscale(.3); }

/* ---------- STORE DETAIL ---------- */
.sd { display:grid; grid-template-columns: 660px minmax(0,1fr); gap:22px; height:100%; }
.sd-left { display:flex; flex-direction:column; min-height:0; min-width:0; }
.sd-kicks { display:flex; gap:14px; align-items:center; }
.sd-kicks .kick { height:44px; font-size:22px; }
.sd-name { font-size:150px; font-weight:900; font-stretch:62.5%; text-transform:uppercase; line-height:.84;
  letter-spacing:-.01em; margin-top:18px; }
.sd-sub { font-size:21px; font-weight:700; color:var(--mut); margin-top:12px; letter-spacing:.02em; }
.sd-sub b { color:var(--ink); font-weight:800; }
.sd-gp { margin-top:22px; display:flex; align-items:flex-end; justify-content:space-between; gap:16px; }
.sd-gp .money { font-size:132px; line-height:.84; color:var(--acc); text-shadow: 0 0 40px rgba(var(--acc-rgb),.25); }
.sd-gp .delta { font-size:30px; margin-bottom:14px; }
.sd .goal { margin-top:18px; }
.sd .goal-track { height:22px; }
.sd-dev { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:22px; }
.dev { padding:14px 10px 12px; text-align:center; background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px var(--ln); position:relative; }
.dev .lbl { font-size:15px; }
.dev .num { display:block; font-size:86px; line-height:.95; margin-top:4px; }
.dev.hot { background: linear-gradient(160deg, var(--acc), var(--acc2)); box-shadow: 0 10px 36px rgba(var(--acc-rgb),.35); }
.dev.hot .lbl, .dev.hot .num { color: var(--acc-ink); }
.sd-kpis { display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(2,1fr); gap:10px; margin-top:12px; flex:1; min-height:0; max-height:420px; }
.sd-kpis .kpi .kv { font-size:54px; }
.sd-kpis .kpi .kl { font-size:16px; }

/* team leaderboard */
.tp { display:flex; flex-direction:column; min-height:0; min-width:0; padding:22px 26px 18px; }
.tp-head { display:flex; align-items:center; gap:18px; }
.tp-head .kick { height:44px; font-size:22px; }
.tp-head .sh-sub { font-size:19px; }
.tgrid { display:grid; align-items:center; column-gap:14px; }
.tcols { margin-top:18px; padding:0 18px 10px; border-bottom:2px solid var(--ln2); }
.tcols span { font-size:15px; font-weight:800; letter-spacing:.1em; color:var(--mut); text-transform:uppercase; white-space:nowrap; text-align:right; }
.tcols span:nth-child(-n+2) { text-align:left; }
.trows { flex:1; min-height:0; display:flex; flex-direction:column; justify-content:flex-start; padding-top:10px; }
.tr { position:relative; padding:0 18px; flex:none; overflow:hidden; }
.tr::before { content:''; position:absolute; inset:0; background: rgba(255,255,255,.028); }
.tr:nth-child(even)::before { background: rgba(255,255,255,.055); }
.tr > * { position:relative; }
.tr .t-nm { font-weight:900; font-stretch:62.5%; text-transform:uppercase; letter-spacing:.01em; }
.tr .t-v { text-align:right; }
.tr .t-gp { display:flex; flex-direction:column; align-items:flex-end; gap:5px; }
.tr .t-gp .gbar { width:100%; height:5px; background: rgba(255,255,255,.08); position:relative; overflow:hidden; }
.tr .t-gp .gbar i { position:absolute; inset:0; transform-origin:left; transform:scaleX(var(--p,0)); background: linear-gradient(90deg, var(--acc2), var(--acc)); }
.tr .t-wage { color: var(--acc); }
.tr.lead::before { background: linear-gradient(90deg, rgba(var(--acc-rgb),.30), rgba(var(--acc-rgb),.06) 60%, rgba(255,255,255,.03)); box-shadow: inset 4px 0 0 var(--acc); }
.tr .rk-cell { display:flex; align-items:center; }
.tr .rk-cell .rkn { color: var(--mut); }
.tr.lead .rk-cell .rkn { color: var(--acc); }
.c-good { color: var(--good); } .c-warn { color: var(--warn); } .c-low { color: var(--low); } .c-mut { color: var(--dim); }

/* ---------- YESTERDAY'S CONVERSION — scoreboard ---------- */
.yb { height:100%; display:flex; flex-direction:column; padding:18px 26px 20px; }
.ygrid { display:grid; align-items:center; column-gap:var(--ygap, 26px); grid-template-columns: var(--ycols); }
.yh { padding:0 var(--ypad,24px) 10px; border-bottom:2px solid var(--ln2); flex:none; }
.yh span { font-size:18px; font-weight:800; letter-spacing:.14em; color:var(--mut); text-transform:uppercase; text-align:center; white-space:nowrap; }
.yh span:first-child { text-align:left; }
.yh span.hero { color: var(--acc); }
.yrows { flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:var(--yrgap, 10px); padding-top:12px; }
.yr { position:relative; padding:0 var(--ypad,24px); height:var(--yrow); flex:none; }
.yr::before { content:''; position:absolute; inset:0; background: rgba(255,255,255,.03); box-shadow: inset 0 0 0 1px var(--ln); }
.yr:nth-child(even)::before { background: rgba(255,255,255,.055); }
.yr > * { position:relative; z-index:1; }
.yr .yn { font-size:var(--yname); font-weight:900; font-stretch:62.5%; text-transform:uppercase; line-height:1; }
.yr .yv { font-size:var(--ynum); line-height:.9; text-align:center; position:relative; }
.yr .yv.hero { font-size:var(--yhero); align-self:stretch; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.yr .yv.hero::before { content:''; position:absolute; inset:0 -12px; background: rgba(var(--acc-rgb),.08); box-shadow: inset 0 3px 0 rgba(var(--acc-rgb),.5); z-index:-1; }
.yr .yv.hero .ybar { width:78%; }
.yr .yl { display:block; white-space:nowrap; }
.yr .yv.soft { color: var(--dim); }
.yr .ybar { display:block; height:6px; margin:10px auto 0; width:78%; background: rgba(255,255,255,.08); position:relative; overflow:hidden; }
.yr .ybar i { position:absolute; inset:0; transform-origin:left; transform: scaleX(var(--p,0)); background: currentColor; }
.yr .ybar b { position:absolute; top:-2px; bottom:-2px; width:2px; background: rgba(255,255,255,.55); left: var(--tick, 66.6%); }
.yr .dash { font-size:.5em; color:var(--dim); }
.yr.total::before { background: linear-gradient(100deg, rgba(var(--acc-rgb),.24), rgba(var(--acc-rgb),.08)); box-shadow: inset 0 0 0 2px rgba(var(--acc-rgb),.55), 0 0 40px rgba(var(--acc-rgb),.15); }
.yr.total .yn { color: var(--acc); }
.y-empty, .panel-note { margin:auto; font-size:30px; font-weight:800; color:var(--mut); }

/* ---------- CLEAN DAYS LEADERBOARD ---------- */
.cd { height:100%; display:flex; flex-direction:column; }
.cd-legend { display:flex; gap:10px; flex:none; }
.lg { display:inline-flex; align-items:center; gap:8px; height:34px; padding:0 14px; font-size:18px; font-weight:900; font-stretch:75%;
  letter-spacing:.04em; white-space:nowrap; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px var(--ln2); }
.lg i { width:14px; height:14px; transform: skewX(-12deg); display:inline-block; }
.lg.red i { background: var(--low); } .lg.amber i { background: var(--warn); } .lg.green i { background: var(--good); }
.lg.gold { color: var(--gold-ink); background: linear-gradient(100deg, var(--gold-a), var(--gold-b)); box-shadow:none; }
.lg.gold i { background: var(--gold-c); }
.cd-list { flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:var(--cgap,10px); }
.cr { position:relative; display:grid; align-items:center; column-gap:30px; height:var(--crow); flex:none; overflow:hidden;
  grid-template-columns: var(--ccols); padding: 0 30px 0 34px; }
.cr::before { content:''; position:absolute; inset:0; background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px var(--ln); }
.cr::after { content:''; position:absolute; left:0; top:0; bottom:0; width:12px; background: var(--dim); }
.cr > * { position:relative; z-index:1; }
.cr .c-rk { display:flex; align-items:center; justify-content:center; }
.cr .c-nm { display:flex; align-items:center; gap:.3em; min-width:0; font-size:var(--cname); font-weight:900; font-stretch:62.5%; text-transform:uppercase; line-height:1; }
.cr .c-nm .fit { flex:0 1 auto; }
.cr .c-flag { font-size:var(--cflag); font-weight:900; letter-spacing:.12em; color:var(--mut); font-stretch:100%; white-space:nowrap; margin-left:.4em; }
.cr .c-track { display:flex; gap:4px; height:var(--ctrack, 30px); align-items:stretch; }
.cr .c-track i { flex:1; background: rgba(255,255,255,.08); transform: skewX(-14deg); }
.cr .c-track i.on { background: var(--tier); box-shadow: 0 0 10px rgba(var(--tier-rgb),.45); }
.cr .c-num { display:flex; align-items:baseline; justify-content:flex-end; gap:.16em; }
.cr .c-num .num { font-size:var(--cnum); line-height:.8; }
.cr .c-num .unit { font-size:var(--cunit); font-weight:900; letter-spacing:.14em; color:var(--mut); }
.cr .c-date { text-align:right; font-size:var(--cdate); font-weight:800; color:var(--mut); line-height:1.15; white-space:nowrap; }
.cr .c-date span { display:block; font-size:.66em; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
.cr .c-note { grid-column: 3 / -1; text-align:right; font-size:var(--cdate); font-weight:800; font-style:italic; color:var(--mut); white-space:nowrap; }
/* tiers */
.cr.t-red   { --tier: var(--low);  --tier-rgb: var(--low-rgb); }
.cr.t-amber { --tier: var(--warn); --tier-rgb: var(--warn-rgb); }
.cr.t-green { --tier: var(--good); --tier-rgb: var(--good-rgb); }
.cr.t-red::after, .cr.t-amber::after, .cr.t-green::after { background: var(--tier); box-shadow: 0 0 22px rgba(var(--tier-rgb),.8); }
.cr.t-red::before, .cr.t-amber::before, .cr.t-green::before { background: linear-gradient(90deg, rgba(var(--tier-rgb),.20), rgba(var(--tier-rgb),.05) 55%, rgba(255,255,255,.03)); box-shadow: inset 0 0 0 1px rgba(var(--tier-rgb),.35); }
.cr.t-red .c-num .num, .cr.t-amber .c-num .num, .cr.t-green .c-num .num { color: var(--tier); }
.cr.t-red .c-nm, .cr.t-amber .c-nm, .cr.t-green .c-nm { color: var(--ink); }
.cr.t-gold { --tier: #7A4E00; --tier-rgb: 122,78,0; }
.cr.t-gold::before { background: linear-gradient(102deg, #FFF1BE 0%, #FFDA6A 30%, #FFC229 58%, #FFE391 100%); box-shadow: 0 0 44px rgba(255,194,41,.45); }
.cr.t-gold::after { background: linear-gradient(180deg, #FFF3C4, #B87700); }
.cr.t-gold .c-nm, .cr.t-gold .c-num .num { color: var(--gold-ink); }
.cr.t-gold .c-num .unit, .cr.t-gold .c-date, .cr.t-gold .c-date span { color: #7A5200; }
.cr.t-gold .c-track i { background: rgba(90,55,0,.18); }
.cr.t-gold .c-track i.on { background: #6B4300; box-shadow:none; }
.cr.t-gold .shine { position:absolute; inset:-40% -20%; z-index:2; pointer-events:none;
  background: linear-gradient(104deg, rgba(255,255,255,0) 38%, rgba(255,255,255,.75) 50%, rgba(255,255,255,0) 62%);
  transform: translateX(-130%); animation: shine 8s cubic-bezier(.45,0,.25,1) 1.4s infinite; }
@keyframes shine { 0% { transform:translateX(-130%); } 24% { transform:translateX(130%); } 100% { transform:translateX(130%); } }
.cr.t-neutral::after { background: var(--mut); }
.cr.t-neutral .c-num .num { color: var(--ink); }
.cr.t-none { opacity:.62; }
.cr.t-none .c-nm { color: var(--mut); }
.cd-foot { display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; margin-top:16px; flex:none; }
.stat { height:96px; padding:0 24px; display:flex; flex-direction:column; justify-content:center; min-width:0; }
.stat .lbl { font-size:15px; }
.stat .v { font-size:44px; font-weight:900; font-stretch:62.5%; line-height:1.05; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-transform:uppercase; }
.stat .v em { font-style:normal; color: var(--acc); }

/* ---------- RANKINGS (DM / REGION) ---------- */
.rk2 { display:grid; grid-template-columns: 1fr 1fr; gap:20px; height:100%; }
.rkp { display:flex; flex-direction:column; min-height:0; min-width:0; padding:16px 18px 14px; }
.rkrows { flex:1; min-height:0; display:flex; flex-direction:column; gap:var(--rgap,5px); padding-top:8px; }
.rr { position:relative; height:var(--rrow); flex:none; padding:0 14px; overflow:hidden; }
.rr::before { content:''; position:absolute; inset:0; background: rgba(255,255,255,.03); }
.rr:nth-child(even)::before { background: rgba(255,255,255,.055); }
.rr > * { position:relative; }
.rr .r-nm { font-weight:900; font-stretch:68%; text-transform:uppercase; display:flex; align-items:center; min-width:0; }
.rr .r-v { text-align:right; }
.rr.mine::before { background: linear-gradient(90deg, rgba(var(--acc-rgb),.34), rgba(var(--acc-rgb),.10)); box-shadow: inset 5px 0 0 var(--acc), inset 0 0 0 1px rgba(var(--acc-rgb),.45); }
.rr.mine .r-nm { color: #fff; }
.rhead { padding:0 14px 8px; border-bottom:2px solid var(--ln2); }
.rhead span { font-size:14px; font-weight:800; letter-spacing:.1em; color:var(--mut); text-transform:uppercase; white-space:nowrap; text-align:right; }
.rhead span:nth-child(-n+2) { text-align:left; }

/* ---------- PROMO ---------- */
.promo { height:100%; display:flex; align-items:center; justify-content:center; }
.promo-frame { position:relative; padding:14px; background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px var(--ln2), 0 30px 90px rgba(0,0,0,.55);
  animation: promoFloat 7s ease-in-out infinite alternate; }
@keyframes promoFloat { from { transform: translateY(0); } to { transform: translateY(-10px); } }
.promo-frame img { display:block; max-width:1780px; max-height: calc(var(--sh) - 22px - 62px - 78px - 60px); width:auto; height:auto; object-fit:contain; }
.promo-frame .brk { position:absolute; width:64px; height:64px; border: 6px solid var(--acc); }
.promo-frame .brk.tl { left:-14px; top:-14px; border-right:none; border-bottom:none; }
.promo-frame .brk.tr { right:-14px; top:-14px; border-left:none; border-bottom:none; }
.promo-frame .brk.bl { left:-14px; bottom:-14px; border-right:none; border-top:none; }
.promo-frame .brk.br { right:-14px; bottom:-14px; border-left:none; border-top:none; }
.promo-missing { padding:90px 120px; text-align:center; color:var(--mut); font-size:34px; font-weight:800; }
.promo-missing span { display:block; font-size:22px; margin-top:12px; }

/* ---------- KINETIC ENTRANCES ---------- */
/* Everything is VISIBLE by default. The entrance keyframes (fill-mode both)
   hide each element only while its own animation is pending, so a browser
   that never runs CSS animations still shows a complete, static slide. */
.slide.go .ki { animation: kiUp .8s var(--ease) both; animation-delay: calc(var(--d0, 0ms) + var(--i, 0) * 55ms); }
.slide.go .ki-l { animation-name: kiL; }
.slide.go .ki-r { animation-name: kiR; }
.slide.go .ki-pop { animation-name: kiPop; animation-timing-function: var(--ease-back); animation-duration:.7s; }
.slide.go .ki-drop { animation-name: kiDrop; }
.slide.go .ki-wipe { animation-name: kiWipe; animation-duration: .9s; }
.slide.go .ki-zoom { animation-name: kiZoom; animation-duration: 1s; }
.slide.static .ki { opacity:1; animation:none !important; }
@keyframes kiUp   { from { opacity:0; transform: translateY(60px) scale(.97); } to { opacity:1; transform:none; } }
@keyframes kiL    { 0% { opacity:0; transform: translateX(-160px) skewX(14deg); } 55% { opacity:1; transform: translateX(10px) skewX(-3deg); } 100% { opacity:1; transform:none; } }
@keyframes kiR    { 0% { opacity:0; transform: translateX(160px) skewX(-14deg); } 55% { opacity:1; transform: translateX(-10px) skewX(3deg); } 100% { opacity:1; transform:none; } }
@keyframes kiPop  { 0% { opacity:0; transform: scale(.4) rotate(-8deg); } 100% { opacity:1; transform:none; } }
@keyframes kiDrop { from { opacity:0; transform: translateY(-70px); } to { opacity:1; transform:none; } }
@keyframes kiWipe { from { opacity:1; clip-path: inset(0 100% 0 0); } to { opacity:1; clip-path: inset(0 0 0 0); } }
@keyframes kiZoom { 0% { opacity:0; transform: scale(1.5); } 60% { opacity:1; } 100% { opacity:1; transform:none; } }
.sd-name { transform-origin: left center; }
/* bars sweep in after their row lands */
.slide.go .goal-track > i, .slide.go .gbar i, .slide.go .ybar i { animation: barGrow 1.3s var(--ease) both; animation-delay: calc(var(--d0, 0ms) + 350ms + var(--i, 0) * 55ms); }
.slide.static .goal-track > i, .slide.static .gbar i, .slide.static .ybar i { transform: scaleX(var(--p,0)); animation:none; }
@keyframes barGrow { from { transform: scaleX(0); } to { transform: scaleX(var(--p,0)); } }
/* clean-days track segments light up one after another */
.slide.go .c-track i.on { animation: segOn .25s ease-out both; animation-delay: calc(var(--d0, 0ms) + 420ms + var(--i, 0) * 55ms + var(--s, 0) * 22ms); }
.slide.static .c-track i.on { opacity:1; animation:none; }
@keyframes segOn { from { opacity:.15; transform: skewX(-14deg) scaleY(.4); } to { opacity:1; transform: skewX(-14deg); } }
/* a light sweep across the lead item once everything has landed */
.sweep { position:relative; overflow:hidden; }
.sweep > .sw { position:absolute; inset:-30% -10%; z-index:3; pointer-events:none;
  background: linear-gradient(100deg, transparent 40%, rgba(255,255,255,.22) 50%, transparent 60%); transform: translateX(-120%); }
.slide.go .sweep > .sw { animation: sweep 6.5s ease-in-out infinite; animation-delay: calc(var(--d0, 0ms) + 1500ms); }
@keyframes sweep { 0% { transform: translateX(-120%); } 20%, 100% { transform: translateX(120%); } }

/* ---------- STINGER (slide-change wipe) ---------- */
#stinger { position:absolute; inset:0; z-index:40; pointer-events:none; overflow:hidden; visibility:hidden; }
#stinger.run { visibility:visible; }
#stinger .stp { position:absolute; inset:0; }
#stinger.rev .stp { transform: scaleX(-1); }
#stinger .p { position:absolute; top:0; bottom:0; left:-15%; width:130%; transform: translateX(-130%) skewX(-18deg); }
#stinger .p1 { background: var(--acc2); }
#stinger .p2 { background: var(--acc); }
#stinger .p3 { background: #F3F5FA; }
#stinger .p4 { background: linear-gradient(100deg, #0A0F1C, #04060B); }
#stinger .p4::after { content:''; position:absolute; inset:0; background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1.6px); background-size:6px 6px; }
#stinger.run[data-v="slash"] .p { animation: stSlash 1.05s both; will-change: transform; }
#stinger.run[data-v="slash"] .p2 { animation-delay: 45ms; }
#stinger.run[data-v="slash"] .p3 { animation-delay: 90ms; }
#stinger.run[data-v="slash"] .p4 { animation-delay: 125ms; }
@keyframes stSlash {
  0%   { transform: translateX(-130%) skewX(-18deg); animation-timing-function: cubic-bezier(.55,0,.75,.2); }
  38%  { transform: translateX(0) skewX(-18deg); }
  58%  { transform: translateX(0) skewX(-18deg); animation-timing-function: cubic-bezier(.25,.8,.35,1); }
  100% { transform: translateX(130%) skewX(-18deg); }
}
/* blinds: vertical slats */
#stinger .bl { position:absolute; inset:0; display:flex; visibility:hidden; }
#stinger .bl i { flex:1; background: #070B15; transform: scaleY(0); transform-origin: top; }
#stinger .bl i:nth-child(odd) { background: var(--acc); transform-origin: bottom; }
#stinger .bl i:nth-child(4n) { background: #0B1222; }
#stinger.run[data-v="blinds"] .bl { visibility:visible; }
#stinger.run[data-v="blinds"] .p { display:none; }
#stinger.run[data-v="blinds"] .bl i { animation: stBlind 1.05s both; animation-delay: calc(var(--k) * 32ms); will-change: transform; }
@keyframes stBlind {
  0%   { transform: scaleY(0); animation-timing-function: cubic-bezier(.6,0,.8,.3); }
  36%  { transform: scaleY(1); }
  58%  { transform: scaleY(1); animation-timing-function: cubic-bezier(.2,.8,.3,1); }
  100% { transform: scaleY(0); }
}
/* iris: accent disc bursts out, dark disc follows, both blow past the screen */
#stinger .ir { position:absolute; left:50%; top:50%; width:2600px; height:2600px; margin:-1300px 0 0 -1300px; border-radius:50%; transform: scale(0); visibility:hidden; }
#stinger .ir1 { background: radial-gradient(circle, var(--acc) 0 58%, var(--acc2) 70%); }
#stinger .ir2 { background: #060912; }
#stinger.run[data-v="iris"] .ir { visibility:visible; animation: stIris 1.05s both; will-change: transform, opacity; }
#stinger.run[data-v="iris"] .ir2 { animation-delay: 110ms; }
#stinger.run[data-v="iris"] .p { display:none; }
@keyframes stIris {
  0%   { transform: scale(0); opacity:1; animation-timing-function: cubic-bezier(.55,0,.8,.3); }
  40%  { transform: scale(1); opacity:1; }
  60%  { transform: scale(1); opacity:1; animation-timing-function: ease-out; }
  100% { transform: scale(1.35); opacity:0; }
}
/* the incoming slide's name slams in while the screen is covered */
#stinger .st-title { position:absolute; left:0; right:0; top:50%; text-align:center; opacity:0;
  font-size:190px; font-weight:900; font-stretch:62.5%; text-transform:uppercase; line-height:1; letter-spacing:-.01em;
  color:#fff; transform: translateY(-50%); white-space:nowrap; }
#stinger .st-title b { color: var(--acc); font-weight:900; }
#stinger .st-title small { display:block; font-size:34px; font-weight:800; font-stretch:100%; letter-spacing:.3em; color: var(--acc); margin-bottom:14px; }
#stinger.run .st-title { animation: stTitle 1.05s both; animation-delay: 120ms; }
@keyframes stTitle {
  0%, 30% { opacity:0; transform: translateY(-50%) scale(1.25) skewX(-10deg); }
  42%     { opacity:1; transform: translateY(-50%) scale(1) skewX(-10deg); }
  60%     { opacity:1; transform: translateY(-50%) scale(.98) skewX(-10deg); }
  76%, 100% { opacity:0; transform: translateY(-50%) translateX(260px) skewX(-10deg); }
}

/* ---------- TICKER (the old header + footer, 48 px) ---------- */
#ticker { position:absolute; left:0; right:0; bottom:0; height:48px; z-index:44; display:flex; align-items:stretch;
  background: rgba(3,5,10,.94); box-shadow: 0 -1px 0 var(--ln2); }
.tk-prog { position:absolute; left:0; right:0; top:-3px; height:3px; background: rgba(255,255,255,.06); }
.tk-prog > div { height:100%; width:100%; background: linear-gradient(90deg, var(--acc2), var(--acc)); box-shadow: 0 0 12px rgba(var(--acc-rgb),.8); transition: width .1s linear; }
.tk-brand { isolation:isolate; flex:none; display:flex; align-items:center; gap:12px; padding:0 34px 0 16px; position:relative; color: var(--acc-ink); }
.tk-brand::before { content:''; position:absolute; top:0; bottom:0; left:-20px; right:0; background: linear-gradient(100deg, var(--acc), var(--acc2)); transform: skewX(-16deg); transform-origin: bottom; z-index:-1; }
.tk-brand img { width:36px; height:36px; border-radius:50%; box-shadow: 0 0 0 2px rgba(0,0,0,.35); }
.tk-brand b { display:block; font-size:21px; font-weight:900; font-stretch:75%; letter-spacing:.06em; line-height:1; }
.tk-brand span { display:block; font-size:12px; font-weight:800; letter-spacing:.14em; line-height:1; margin-top:4px; opacity:.8; }
.tk-crawl { flex:1; min-width:0; overflow:hidden; position:relative; display:flex; align-items:center;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 60px, #000 calc(100% - 60px), transparent);
          mask-image: linear-gradient(90deg, transparent, #000 60px, #000 calc(100% - 60px), transparent); }
.tk-track { display:flex; white-space:nowrap; will-change: transform; animation: crawl var(--crawl-dur, 60s) linear infinite; }
@keyframes crawl { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.tk-item { font-size:21px; font-weight:700; color: var(--ink); padding-right:34px; display:inline-flex; align-items:center; }
.tk-item b { color: var(--acc); font-weight:900; font-stretch:75%; letter-spacing:.03em; margin-right:.35em; text-transform:uppercase; }
.tk-item::before { content:''; width:10px; height:10px; background: var(--acc); transform: rotate(45deg); margin-right:22px; flex:none; }
.tk-status { flex:none; display:flex; align-items:center; gap:18px; padding:0 20px 0 18px; box-shadow: -1px 0 0 var(--ln2); }
.tk-live { display:inline-flex; align-items:center; gap:8px; font-size:17px; font-weight:900; letter-spacing:.14em; color: var(--low); }
.tk-live i { width:10px; height:10px; border-radius:50%; background: var(--low); box-shadow: 0 0 10px var(--low); animation: livePulse 1.6s ease-in-out infinite; }
.tk-live.paused { color: var(--warn); }
.tk-live.paused i { background: var(--warn); box-shadow:none; animation:none; border-radius:0; width:10px; height:12px; background: linear-gradient(90deg, var(--warn) 0 35%, transparent 35% 65%, var(--warn) 65%); }
@keyframes livePulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.35; transform:scale(.7); } }
.tk-day { font-size:17px; font-weight:900; letter-spacing:.14em; color: var(--acc); }
.tk-time { font-size:19px; font-weight:800; color: var(--ink); font-variant-numeric: tabular-nums; white-space:nowrap; }
.tk-count { font-size:19px; font-weight:900; font-stretch:75%; color: var(--mut); font-variant-numeric: tabular-nums; min-width:62px; text-align:right; }
.tk-count b { color: var(--ink); }

/* ---------- CONTROL DOCK (rises on activity) ---------- */
#dock { position:absolute; left:50%; bottom:66px; z-index:46; display:flex; align-items:center; gap:14px;
  padding:12px 16px; background: rgba(9,13,23,.96); box-shadow: inset 0 0 0 1px var(--ln2), 0 24px 70px rgba(0,0,0,.65);
  transform: translate(-50%, 30px); opacity:0; pointer-events:none;
  transition: opacity .35s ease, transform .45s var(--ease); white-space:nowrap; max-width:1860px; }
#dock.awake { opacity:1; transform: translate(-50%, 0); pointer-events:auto; }
.district-tabs { display:flex; gap:6px; }
.district-tab { height:44px; display:inline-flex; align-items:center; padding:0 16px; font-size:18px; font-weight:800; font-stretch:87.5%;
  color: var(--mut); background: rgba(255,255,255,.05); cursor:pointer; letter-spacing:.03em; transition: background .2s, color .2s; }
.district-tab:hover { color: var(--ink); background: rgba(255,255,255,.1); }
.district-tab.active { background: var(--acc); color: var(--acc-ink); }
.district-count { margin-left:8px; font-size:14px; opacity:.7; }
.dk-sel { font-family:inherit; height:44px; font-size:17px; font-weight:800; color: var(--ink); background: #111829;
  border:1px solid var(--ln2); padding:0 12px; cursor:pointer; max-width:260px; border-radius:0; }
.dk-sel.has-selection { border-color: var(--acc); color: var(--acc); }
.dk-sep { width:1px; height:34px; background: var(--ln2); }
.ctl-btn { width:48px; height:48px; border:none; background: rgba(255,255,255,.07); color: var(--ink); cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex:none; transition: background .2s, transform .15s; }
.ctl-btn:hover { background: rgba(255,255,255,.14); transform: scale(1.06); }
.ctl-btn svg { width:20px; height:20px; fill: currentColor; }
.ctl-btn.play-pause { width:56px; height:56px; background: var(--acc); color: var(--acc-ink); }

/* ---------- TOAST (fresh numbers) ---------- */
.toast { position:absolute; top:40px; left:0; z-index:45; display:flex; align-items:stretch; height:76px;
  transform: translateX(-105%); transition: transform .7s var(--ease); pointer-events:none; }
.toast.show { transform: translateX(0); }
.toast .tg { display:flex; align-items:center; padding:0 26px 0 40px; background: var(--acc); color: var(--acc-ink);
  font-size:30px; font-weight:900; font-stretch:75%; letter-spacing:.08em; }
.toast .tm { display:flex; align-items:center; padding:0 40px 0 26px; background:#F3F5FA; color:#070A12;
  font-size:30px; font-weight:800; clip-path: polygon(0 0, 100% 0, calc(100% - 26px) 100%, 0 100%); padding-right:64px; }

/* ---------- LOADING ---------- */

#loading { position:fixed; inset:0; z-index:50;

  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; font-family: var(--fx); }

  background: var(--acc); border:none; padding:14px 40px; cursor:pointer; text-transform:uppercase; }

</style>
