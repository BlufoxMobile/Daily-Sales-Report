<!-- Shared store-name normalizer (hosted by this repo). Must load BEFORE the
     inline script so T-Sheet store labels can be resolved to canonical names. -->
<script src="store-aliases.js"></script>
<script>
// ================= CONFIG (unchanged from previous version) =================
const CONFIG = {
  RSD_NAME: 'Jeffrey Bilbrey',
  EXCEL_URL: 'https://raw.githubusercontent.com/BlufoxMobile/Daily-Sales-Report/main/data/Sales%20Report.xlsx',
  PROMO_URL: 'https://raw.githubusercontent.com/BlufoxMobile/Daily-Sales-Report/main/data/promo-card.jpg',
  STREAKS_URL: 'https://raw.githubusercontent.com/BlufoxMobile/Daily-Sales-Report/main/data/nps-detractor-streaks.json',
  SLIDE_INTERVAL: 15000,     // 15 seconds per slide
  // Auto-refresh window: look for a newly uploaded Sales Report every
  // `everyMin` minutes between startMin and endMin (minutes since midnight).
  // Default: 9:00 AM – 11:30 AM, every 30 minutes.
  REFRESH_WINDOW: { startMin: 9 * 60, endMin: 11 * 60 + 30, everyMin: 30 },
  STORE_CARDS_PER_PAGE: 6,
  REPS_PER_PAGE: 14,
  PROMO_EVERY_N: 4,
  ZERO_SHEET: 'Zero',
  TSHEET_API_URL: 'https://script.google.com/macros/s/AKfycbyQaa1yvggLJuw5dcme74vwAW3hSB3BvzCK40IhLThy-F8KZDFOF6gcyl8psNMd3yD-Cg/exec',
  DISTRICT_RANK_SHEET: 'District Rank',
  REGION_RANK_SHEET: 'Region Rank',
  OUR_REGIONS: ['Greater Chicago', 'Big South'],
};

// ============ DAY-OF-WEEK ACCENT ============
// Broadcast Arena (2026-09-25): the board still wears a fresh color every
// day, now as one vivid accent on the dark arena. acc = the accent,
// acc2 = the second stop of its gradient, rgb = acc for glows, on = text
// sitting on an accent plate. Same rainbow week as before, except Monday is
// ice blue instead of red so a Monday board never reads as "all behind".
const DAY_COLORS = {
  0: { name:'SUNDAY',    acc:'#FF4FA3', acc2:'#FF9A5C', rgb:'255,79,163',  on:'#1A0410' },
  1: { name:'MONDAY',    acc:'#2FD6FF', acc2:'#4F7CFF', rgb:'47,214,255',  on:'#02121A' },
  2: { name:'TUESDAY',   acc:'#FF8A1E', acc2:'#FFD23F', rgb:'255,138,30',  on:'#1C0C00' },
  3: { name:'WEDNESDAY', acc:'#FFD21F', acc2:'#FF8A1E', rgb:'255,210,31',  on:'#1C1500' },
  4: { name:'THURSDAY',  acc:'#2EE68A', acc2:'#1FD1FF', rgb:'46,230,138',  on:'#03130A' },
  5: { name:'FRIDAY',    acc:'#4C8DFF', acc2:'#9B6BFF', rgb:'76,141,255',  on:'#030A1C' },
  6: { name:'SATURDAY',  acc:'#A66BFF', acc2:'#FF52C8', rgb:'166,107,255', on:'#10041F' },
};

// ================= DISTRICTS =================
// Districts align with the Big South Chicago market layout.
// dmMatch = DM surname substring(s) from the Store Rank sheet.
// storeMatch = stores pulled INTO this district regardless of DM.
// storeExclude = stores kept OUT of this district even if the DM matches.
const DISTRICTS = [
  { key: 'all',       label: 'All Stores',    tab: 'All',        dmMatch: null },
  { key: 'north',     label: 'Chicago North', tab: 'North',      dmMatch: ['dhorajiwala'], storeMatch: ['cicero'] },
  { key: 'south',     label: 'Chicago South', tab: 'South',      dmMatch: ['carrillo'] },
  { key: 'east',      label: 'Chicago East',  tab: 'East',       dmMatch: ['cabrales'], storeExclude: ['cicero'] },
  { key: 'west',      label: 'Chicago West',  tab: 'West',       dmMatch: ['chowdhury'] },
  { key: 'big-south', label: 'Big South',     tab: 'Big South',  dmMatch: ['brooks'] },
];

let state = {
  stores: [],
  currentDistrict: 'all',
  currentStore: 'all',
  yesterday: { rows: {}, tsheets: {}, date: null, loaded: false, error: null },
  streaks: null,
  dmRanks: [],
  regionRanks: [],
  reps: [],
  promos: null,
  currentSlide: 0,
  totalSlides: 0,
  paused: false,
  dataSig: null,
  slideTimer: null,
  refreshTimer: null,
  countdownTimer: null,
  countdownStart: null,
  lastRefresh: null,
  slides: [],
};

// ============ PERSISTED FILTERS (same storage key as before) ============
const FILTER_STORAGE_KEY = 'c3-slides-filter-v1';
function savePersistedFilters() {
  try {
    localStorage.setItem(FILTER_STORAGE_KEY, JSON.stringify({
      district: state.currentDistrict, store: state.currentStore,
    }));
  } catch (e) {}
}
// Set when the saved district key was missing/unknown but a real store was
// saved: the district has to be re-derived from that store. findDistrictForStore
// reads state.stores, which is still empty when filters load, so the derivation
// is deferred to applyPendingDistrict() (called once the workbook is parsed).
let pendingDistrictFromStore = false;
function loadPersistedFilters() {
  try {
    const raw = localStorage.getItem(FILTER_STORAGE_KEY);
    if (!raw) return;
    const v = JSON.parse(raw);
    const validDistrict = !!(v.district && DISTRICTS.some(d => d.key === v.district));
    if (validDistrict) state.currentDistrict = v.district;
    if (v.store) state.currentStore = v.store;
    // District keys get renamed between releases; recover from the saved store
    // rather than silently dropping the user back to the "All Stores" tab.
    pendingDistrictFromStore = !validDistrict && !!v.store && v.store !== 'all';
  } catch (e) {}
}
function applyPendingDistrict() {
  if (!pendingDistrictFromStore) return;
  pendingDistrictFromStore = false;
  const dist = findDistrictForStore(state.currentStore);
  if (dist) state.currentDistrict = dist.key;
  savePersistedFilters();
}

// ============ DAY THEME ============
function applyDayColor() {
  const day = DAY_COLORS[new Date().getDay()];
  const root = document.documentElement;
  root.style.setProperty('--acc',     day.acc);
  root.style.setProperty('--acc2',    day.acc2);
  root.style.setProperty('--acc-rgb', day.rgb);
  root.style.setProperty('--acc-ink', day.on);
}
function scheduleDayColorAtMidnight() {
  const now = new Date();
  const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
  setTimeout(() => { applyDayColor(); render(); scheduleDayColorAtMidnight(); }, tomorrow - now);
}
function getDayInfo() { return DAY_COLORS[new Date().getDay()]; }

// ============ DISTRICT HELPERS ============
function getActiveDistrict() {
  return DISTRICTS.find(d => d.key === state.currentDistrict) || DISTRICTS[0];
}
function storeMatchesDistrict(store, dist) {
  if (!dist) return true;
  const name = String(store.name || '').toLowerCase();
  // Explicit exclusions win over a DM match (e.g. Cicero reports to the East DM
  // but belongs to Chicago North on the market org chart). They are checked
  // before the dmMatch guard so a district declared with dmMatch:null still
  // honours its storeExclude list instead of swallowing the whole market.
  if (dist.storeExclude && dist.storeExclude.some(m => name.includes(m))) return false;
  if (dist.storeMatch && dist.storeMatch.some(m => name.includes(m))) return true;
  // No dmMatch = catch-all district ('all'): everything not excluded above.
  if (!dist.dmMatch) return true;
  const dm = String(store.dm || '').toLowerCase();
  return dist.dmMatch.some(m => dm.includes(m));
}
function filteredStores() {
  const dist = getActiveDistrict();
  if (!dist) return state.stores;
  return state.stores.filter(s => storeMatchesDistrict(s, dist));
}
function districtCount(distKey) {
  const dist = DISTRICTS.find(d => d.key === distKey);
  if (!dist) return 0;
  return state.stores.filter(s => storeMatchesDistrict(s, dist)).length;
}
function setDistrict(key) {
  if (state.currentDistrict === key) return;
  state.currentDistrict = key;
  state.currentStore = 'all';
  savePersistedFilters();
  buildSlides();
  state.currentSlide = 0;
  render();
  startSlideshow();
}
function setStore(name) {
  if (state.currentStore === name) return;
  state.currentStore = name;
  if (name && name !== 'all') {
    const dist = findDistrictForStore(name);
    if (dist) state.currentDistrict = dist.key;
  }
  savePersistedFilters();
  buildSlides();
  state.currentSlide = 0;
  render();
  startSlideshow();
}
function findDistrictForStore(storeName) {
  const store = state.stores.find(s => s.name.toLowerCase() === String(storeName).toLowerCase());
  if (!store) return null;
  for (const d of DISTRICTS) {
    if (d.key === 'all') continue;
    if (storeMatchesDistrict(store, d)) return d;
  }
  return null;
}

// ============ YESTERDAY'S CONVERSION LOADERS (unchanged) ============
function parseZeroSheet(wb) {
  // Perf (2026-09-24): sheetRows() = prebuilt JSON rows or sheet_to_json (identical).
  const aoa = sheetRows(wb, CONFIG.ZERO_SHEET, { header: 1, defval: null, raw: true });
  if (!aoa) return {};
  let headerIdx = -1;
  for (let i = 0; i < Math.min(aoa.length, 10); i++) {
    if (aoa[i] && aoa[i][0] && String(aoa[i][0]).trim().toLowerCase() === 'store name') { headerIdx = i; break; }
  }
  if (headerIdx === -1) return {};
  const out = {};
  for (let i = headerIdx + 1; i < aoa.length; i++) {
    const r = aoa[i];
    if (!r || !r[0]) continue;
    const name = String(r[0]).trim();
    const mobile  = Number(r[2]) || 0;
    const mcrRaw  = r[7];
    const traffic = Number(r[8]) || 0;
    const mcr = (typeof mcrRaw === 'number') ? (mcrRaw <= 1 ? mcrRaw * 100 : mcrRaw) : null;
    out[name] = { store: name, traffic, mobile, mcr };
  }
  return out;
}
// T-sheet days are STORE days (America/Chicago), as in the counts file, the
// dashboard and the digest. The feed's timestamps are UTC ISO strings, so
// slicing them (and toISOString() here) cut each day at 7 PM Central: evening
// t-sheets (~2.7% of all rows, measured 2026-09-24) landed on the next day.
const CHICAGO_DAY = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit' });
function chicagoDay(v) { const d = new Date(v); return isNaN(d.getTime()) ? '' : CHICAGO_DAY.format(d); }
function yesterdayISO() {
  const d = new Date(chicagoDay(Date.now()) + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() - 1);
  return d.toISOString().slice(0, 10);
}
async function loadTSheetCounts() {
  const url = CONFIG.TSHEET_API_URL + '?t=' + Date.now();
  // Perf (2026-09-02): this Apps Script feed was fetched with NO timeout, so
  // when it hung (store wifi) the promise never settled. Measured 2026-09-02:
  // a normal answer takes 12.7-16.7 s and is ~2.3 MB; one call in three came
  // back 404 after 56 s. The 45 s cap is therefore a safety net above the
  // normal latency, NOT a speed-up - the deck no longer waits for this call
  // at all (see loadData). On abort the slide shows no T-Chart counts, exactly
  // as a failed call already did.
  const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const killer = setTimeout(() => { if (ctrl) ctrl.abort(); }, 45000);
  let resp;
  try { resp = await fetch(url, { method: 'GET', signal: ctrl ? ctrl.signal : undefined }); }
  catch (e) { clearTimeout(killer); return { counts: {}, date: null, ok: false }; }
  if (!resp.ok) { clearTimeout(killer); return { counts: {}, date: null, ok: false }; }
  const data = await resp.json().catch(() => null);
  clearTimeout(killer);
  const subs = (data && data.submissions) || [];
  if (!subs.length) return { counts: {}, date: null, ok: false };
  const byDate = {};
  for (const s of subs) {
    const ts = s.timestamp; if (!ts) continue;
    const day = chicagoDay(ts); if (!day) continue;
    (byDate[day] = byDate[day] || []).push(s);
  }
  const yISO = yesterdayISO();
  let useDate = byDate[yISO] ? yISO : null;
  if (!useDate) {
    const dates = Object.keys(byDate).sort();
    for (let i = dates.length - 1; i >= 0; i--) {
      if (byDate[dates[i]].length >= 30) { useDate = dates[i]; break; }
    }
    if (!useDate && dates.length) useDate = dates[dates.length - 1];
  }
  const raw = {};
  for (const s of byDate[useDate] || []) {
    if (!s.store) continue;
    raw[s.store] = (raw[s.store] || 0) + 1;
  }
  // Bucket the RAW T-Sheet labels by canonical short store name instead of
  // guessing one expected spelling per store. This keeps "South Skokie Xfinity
  // Store", "Skokie Xfinity Store" and a bare "Machesney Park" all counted.
  const canonStore = (window.BLUFOX_STORES && window.BLUFOX_STORES.normalizeStore)
    ? window.BLUFOX_STORES.normalizeStore
    : function (name) {  // fallback only if store-aliases.js failed to load
        const base = String(name == null ? '' : name)
          .replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim()
          .replace(/\s+xfinity\s+store\s*$/i, '');
        if (/^skokie$/i.test(base)) return 'South Skokie';
        if (/^knoxville$/i.test(base)) return 'South Knoxville';
        return base;
      };
  const byCanon = {};
  for (const label of Object.keys(raw)) {
    const canon = canonStore(label);
    byCanon[canon] = (byCanon[canon] || 0) + raw[label];
  }
  const counts = {};
  for (const s of state.stores) {
    counts[s.name] = byCanon[canonStore(s.name)] || 0;
  }
  return { counts, date: useDate, ok: true };
}
async function loadYesterday(wb) {
  try {
    const rows = parseZeroSheet(wb);
    let tsheets = { counts: {}, date: null, ok: false };
    try { tsheets = await loadTSheetCounts(); } catch (e) {}
    state.yesterday = { rows, tsheets: tsheets.counts || {}, date: tsheets.date, loaded: true, error: null };
  } catch (err) {
    state.yesterday = { rows: {}, tsheets: {}, date: null, loaded: false, error: String(err) };
  }
}

// ============ NPS DETRACTOR STREAKS (days since last detractor) ============
// Separate JSON feed, produced outside the workbook. Fetched alongside the
// workbook and refreshed on the same window. If it is missing, broken, or
// stale the slides are dropped from the rotation entirely — a wrong counter
// on a store TV is worse than no counter at all.
const STREAK_MAX_AGE_DAYS = 3;
const STREAK_GOAL_FALLBACK = 30;

async function loadStreaks() {
  try {
    const resp = await fetch(CONFIG.STREAKS_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const json = await resp.json();
    if (!json || !Array.isArray(json.stores)) throw new Error('malformed payload (no stores array)');
    state.streaks = json;
  } catch (err) {
    console.warn('[detractor streaks] unavailable — detractor slides will be skipped:', err && err.message ? err.message : err);
    state.streaks = null;
  }
}

// Cheap "did the feed move?" key so a workbook-unchanged refresh still notices
// a new streaks file.
function streakSignature(s) {
  if (!s) return '';
  return String(s.updatedAt || '') + '|' + String(s.asOf || '') + '|' + (Array.isArray(s.stores) ? s.stores.length : 0);
}

// Only warn once per distinct payload so a district-tab click doesn't spam.
let streakWarnKey = null;
function streakWarn(key, msg) {
  if (streakWarnKey === key) return;
  streakWarnKey = key;
  console.warn('[detractor streaks] ' + msg);
}

// Gatekeeper for the whole slide family.
function streaksUsable() {
  const s = state.streaks;
  if (!s || !Array.isArray(s.stores) || !s.stores.length) {
    streakWarn('missing', 'no usable data — detractor slides omitted from the rotation');
    return false;
  }
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s.asOf || ''));
  if (!m) {
    streakWarn(streakSignature(s), 'missing/unreadable asOf date — detractor slides omitted');
    return false;
  }
  const asOf = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  const ageDays = (Date.now() - asOf.getTime()) / 86400000;
  if (ageDays > STREAK_MAX_AGE_DAYS) {
    streakWarn(streakSignature(s), 'stale (asOf ' + s.asOf + ', ' + Math.floor(ageDays) + ' days old) — detractor slides omitted');
    return false;
  }
  streakWarnKey = null;
  return true;
}

// Districts are matched on districtKey from the feed — NOT on DM names — so a
// district never silently disappears because a DM moved.
function streakStoresForDistrict(key) {
  const s = state.streaks;
  if (!s || !Array.isArray(s.stores)) return [];
  const rows = s.stores.filter(r => String(r.districtKey || '') === key);
  // Three tiers: ranked competitors, then window-limited stores (a real day
  // count, but bounded by their own survey history, so not comparable), then
  // stores with no survey data at all.
  const tier = r => (r.status === 'no-data' || r.days == null) ? 2 : (r.windowLimited ? 1 : 0);
  return rows.sort((a, b) => {
    if (tier(a) !== tier(b)) return tier(a) - tier(b);
    if (tier(a) === 2) return String(a.store).localeCompare(String(b.store));
    if (b.days !== a.days) return b.days - a.days;
    return String(a.store).localeCompare(String(b.store));
  });
}

function fmtStreakDate(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
  if (!m) return null;
  return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]))
    .toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

const escHtml = v => String(v == null ? '' : v)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

// ============ DM / REGION RANK PARSER (unchanged) ============
function parseRankSheet(wb, sheetName) {
  // Perf (2026-09-24): sheetRows() = prebuilt JSON rows or sheet_to_json (identical).
  const aoa = sheetRows(wb, sheetName, { header: 1, defval: null, raw: true });
  if (!aoa) return [];
  const rows = [];
  let headerIdx = -1;
  for (let i = 0; i < Math.min(aoa.length, 6); i++) {
    if (aoa[i] && String(aoa[i][0] || '').trim() === 'Rank') { headerIdx = i; break; }
  }
  if (headerIdx < 0) return [];
  for (let i = headerIdx + 1; i < aoa.length; i++) {
    const r = aoa[i];
    if (!r || r[0] == null) continue;
    const name = String(r[1] || '').trim();
    if (!name) continue;
    rows.push({
      rank: Number(r[0]) || 0, name,
      avgGpTrend: Number(r[2]) || 0,
      mobilePerInternet: Number(r[3]) || 0,
      gpPerRgu: Number(r[4]) || 0,
      fiscalCr: Number(r[5]) || 0,
      mobileCr: Number(r[7]) || 0,
      gigAttach: Number(r[15]) || 0,
      plusAttach: Number(r[24]) || 0,
      accPerDev: Number(r[31]) || 0,
      nps: Number(r[32]) || 0,
    });
  }
  return rows;
}

// ============ READY HANDSHAKE FOR A FRAMING PAGE ============
// Handshake (2026-09-03): cookcountycooks.com frames this report as the Break
// Room TV and keeps a dark branded card over the frame until the report has
// actually drawn. From outside, the only thing a cross-origin frame ever says
// is its `load` event - and `load` is the wrong signal in both directions:
// it fires BEFORE the workbook fetch + parse (5-15 s on store wifi, measured
// framed: white at 8:12 PM, data at 8:22 PM), and it is held back by the
// 365 KB promo-card probe and the Google Fonts sheet, so on a slow link it
// fires AFTER the slides are already up. So the report tells the frame
// itself: `loading` when the spinner goes up, `ready` the moment #loading is
// hidden and the first slide is drawn, `error` when the Retry screen shows.
// Standalone (window.parent === window) this is a no-op; it never throws.
function postBoardState(phase, extra) {
  try {
    if (window.parent === window) return;
    window.parent.postMessage(Object.assign({ source: 'ccc-board', board: 'daily-sales', state: phase }, extra || {}), '*');
  } catch (e) { /* a frame that cannot be messaged is still a working report */ }
}

// ============ PREBUILT WORKBOOK ROWS ============
// Perf (2026-09-24): XLSX.read of the whole 1.15 MB workbook was ONE ~1.4 s
// main-thread task on every open - about 5 s of frozen iPad, where this report
// shares cookcountycooks.com's thread (Break Room TV and the tool viewer).
// update.yml already writes data/sales-report.json from every uploaded
// workbook, with the same SheetJS 0.18.5 and the same
// sheet_to_json({header:1, defval:null}) call this page makes, stamped with the
// workbook's SHA-256 (scripts/build-sales-json.js). The page still downloads
// the workbook exactly as before, and uses the JSON rows ONLY when that stamp
// matches the bytes it just downloaded - so every number is identical to
// parsing the workbook. Missing, malformed or stale JSON (e.g. the minute or
// two after an upload, before update.yml has rebuilt it) falls back to parsing
// the workbook, now reading only the five sheets this page uses (output
// verified identical on three workbook versions; `dense` is deliberately NOT
// used - in 0.18.5 it drops the defval padding of empty rows).
const SALES_JSON_URL = CONFIG.EXCEL_URL.replace(/Sales%20Report\.xlsx$/, 'sales-report.json');
const DSR_SHEETS = ['Store Rank', 'Rep Rank', 'District Rank', 'Region Rank', 'Zero'];
// Same host, same ?t= and cache mode as the workbook fetch. Never rejects.
function fetchSalesJson() {
  const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const killer = setTimeout(() => { if (ctrl) ctrl.abort(); }, 30000);
  return fetch(SALES_JSON_URL + '?t=' + Date.now(), ctrl ? { signal: ctrl.signal } : undefined)
    .then(r => r.ok ? r.json() : null)
    .catch(() => null)
    .then(j => { clearTimeout(killer); return j; });
}
// -> the JSON's sheets when it was built from exactly `buf`, else null.
async function verifiedSalesRows(jsonReq, buf, names) {
  try {
    // Perf (2026-09-24): wait for the JSON request to settle (fetchSalesJson
    // bounds it at 30 s). A 3 s race used to pick the workbook parse whenever
    // the JSON was merely late - a slow link or a busy iPad. Only a missing,
    // malformed or stale JSON falls back now.
    const j = await jsonReq;
    if (!j || !j.source || !j.sheets || typeof j.source.sha256 !== 'string' || j.source.bytes !== buf.byteLength) return null;
    // Built by the same SheetJS this page would load, or not used at all.
    if (j.sheetjs !== '0.18.5') return null;
    for (const n of names) if (!Array.isArray(j.sheets[n])) return null;
    if (!(window.crypto && window.crypto.subtle)) return null;
    const d = new Uint8Array(await window.crypto.subtle.digest('SHA-256', buf));
    let hex = '';
    for (let i = 0; i < d.length; i++) hex += (d[i] < 16 ? '0' : '') + d[i].toString(16);
    return hex === j.source.sha256.toLowerCase() ? j.sheets : null;
  } catch (e) { return null; }
}
// Every caller passes {header:1, defval:null[, raw:true]} - the exact call the
// JSON was built with (raw defaults to true in sheet_to_json).
function sheetRows(wb, name, opts) {
  if (wb.__rows) return wb.__rows[name] || null;
  const ws = wb.Sheets[name];
  return ws ? XLSX.utils.sheet_to_json(ws, opts) : null;
}
let sheetJsReq = null;
function loadSheetJS() {
  if (typeof XLSX !== 'undefined') return Promise.resolve();
  if (!sheetJsReq) sheetJsReq = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => resolve();
    s.onerror = () => { sheetJsReq = null; s.remove(); reject(new Error('Could not load the spreadsheet reader (cdnjs)')); };
    document.head.appendChild(s);
  });
  return sheetJsReq;
}
// Perf (2026-09-24): FALLBACK PARSE OFF THE MAIN THREAD. When the JSON cannot
// be used (missing, malformed or stale: the minutes after each upload), the
// workbook parse was still one 0.8-1.0 s main-thread task (~2 s on an older
// iPad), which froze cookcountycooks.com too. The same SheetJS 0.18.5 from the
// same cdnjs URL now reads it in a Web Worker with the same options and hands
// back only the plain sheet_to_json rows (structured clone keeps them as-is).
// Resolves null if a worker cannot be used (no Worker, a blob: worker blocked,
// any error in it, or it never starts): the caller then does the main-thread
// read below, exactly as before.
function rowsInWorker(buf, names, readOpts, rowOpts) {
  return new Promise(resolve => {
    let w = null, url = null, done = false, upT = 0;
    const finish = v => {
      if (done) return;
      done = true;
      clearTimeout(upT);
      try { if (w) w.terminate(); } catch (e) {}
      try { if (url) URL.revokeObjectURL(url); } catch (e) {}
      resolve(v);
    };
    try {
      const src = 'postMessage({up:1});importScripts(' + JSON.stringify('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js') + ');' +
        'onmessage=function(e){var q=e.data,out={};try{var wb=XLSX.read(q.buf,q.read);' +
        'q.names.forEach(function(n){var ws=wb.Sheets[n];out[n]=ws?XLSX.utils.sheet_to_json(ws,q.opts):null;});' +
        'postMessage({rows:out});}catch(err){postMessage({error:String(err&&err.message||err)});}};';
      url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
      w = new Worker(url);
      w.onmessage = e => { const d = e.data || {}; if (d.up) clearTimeout(upT); else finish(d.rows || null); };
      w.onerror = w.onmessageerror = () => finish(null);
      upT = setTimeout(() => finish(null), 10000);   // not started in 10 s = no usable worker
      const copy = buf.slice(0);                      // `buf` stays here for the fallback
      w.postMessage({ buf: copy, names: names, read: readOpts, opts: rowOpts }, [copy]);
    } catch (e) { finish(null); }
  });
}

// ============ DATA LOADING (unchanged) ============
async function loadData() {
  const loading = document.getElementById('loading');
  const errorMsg = document.getElementById('errorMsg');
  const retryBtn = document.getElementById('retryBtn');
  if (loading && !state.stores.length) { loading.style.display = 'flex'; errorMsg.style.display = 'none'; retryBtn.style.display = 'none'; postBoardState('loading'); }
  try {
    const cacheBust = '?t=' + Date.now();
    // The detractor-streak feed rides along with the workbook fetch (and the
    // same refresh window). It never blocks the deck: loadStreaks() swallows
    // its own errors and just leaves state.streaks null.
    const prevStreakSig = streakSignature(state.streaks);
    // Perf (2026-09-24): the prebuilt rows ride along with the first load; a
    // background re-check only asks for them once the workbook has changed.
    const salesJson = state.stores.length ? null : fetchSalesJson();
    // Perf (2026-09-24): a hung raw request used to leave "Loading Sales
    // Report..." up forever. On the first load it now reaches the Retry screen
    // after 30 s; a background re-check keeps the old no-timeout behaviour so
    // a slow refresh can never throw the error card over a working deck.
    const wbCtrl = (!state.stores.length && typeof AbortController !== 'undefined') ? new AbortController() : null;
    const wbKiller = wbCtrl ? setTimeout(() => wbCtrl.abort(), 30000) : 0;
    const [resp] = await Promise.all([
      fetch(CONFIG.EXCEL_URL + cacheBust, wbCtrl ? { signal: wbCtrl.signal } : undefined)
        .catch(e => { throw (e && e.name === 'AbortError') ? new Error('The sales report did not download within 30 seconds') : e; }),
      loadStreaks(),
    ]);
    if (!resp.ok) throw new Error('Could not fetch sales report (HTTP ' + resp.status + ')');
    const buf = await resp.arrayBuffer()
      .catch(e => { throw (e && e.name === 'AbortError') ? new Error('The sales report did not download within 30 seconds') : e; });
    clearTimeout(wbKiller);
    // Skip the full reload when the file on GitHub hasn't changed — keeps
    // the slideshow running smoothly during background checks.
    const sig = bufferSignature(buf);
    if (state.dataSig && sig === state.dataSig && state.stores.length) {
      // Workbook is unchanged, but the streaks feed may have moved on.
      if (streakSignature(state.streaks) !== prevStreakSig) {
        const keep = state.currentSlide;
        buildSlides();
        state.currentSlide = Math.min(keep, Math.max(0, state.totalSlides - 1));
        render();
      }
      return;
    }
    const isUpdate = !!state.dataSig && state.stores.length > 0;
    // Perf (2026-09-24): prebuilt rows when they were built from exactly these
    // bytes (see PREBUILT WORKBOOK ROWS); otherwise load SheetJS on demand and
    // read only the five sheets this page uses. Replaces the 2026-09-02 wait
    // for the deferred SheetJS script and the full XLSX.read(buf).
    const rows = await verifiedSalesRows(salesJson || fetchSalesJson(), buf, DSR_SHEETS);
    let wb;
    // Perf (2026-09-24): no usable JSON -> parse in a worker (rowsInWorker);
    // the main-thread read only when a worker cannot be used.
    const readOpts = { type: 'array', sheets: DSR_SHEETS, cellFormula: false, cellHTML: false, cellText: false };
    const wrows = rows ? null : await rowsInWorker(buf, DSR_SHEETS, readOpts, { header: 1, defval: null, raw: true });
    if (rows || wrows) {
      wb = { __rows: rows || wrows };
    } else {
      await loadSheetJS();
      wb = XLSX.read(buf, readOpts);
    }
    console.info('[sales-report] ' + (rows ? 'rows from sales-report.json (sha256 matches the workbook)' : wrows ? 'parsed the workbook in a worker (sales-report.json missing or stale)' : 'parsed the workbook (sales-report.json missing or stale)'));
    // Perf (2026-09-24): remember the signature only once the workbook has
    // been read, so a failed read is retried by the next check.
    state.dataSig = sig;
    parseWorkbook(wb);
    // Perf (2026-09-02): loadYesterday() waits on the T-Sheet Apps Script feed
    // (normally 12.7-16.7 s, sometimes never). It used to be awaited HERE, so
    // every open sat on "Loading Sales Report..." until the feed answered -
    // forever when it hung. The deck now renders as soon as the workbook is
    // parsed; the Yesterday slides show their existing "Loading yesterday's
    // data..." placeholder and re-render when the counts land. Measured
    // time-to-first-slide with the feed at 13 s: LTE 16.0 s -> 2.6 s,
    // fast-3G 27.1 s -> 11.5 s; feed hung: never -> 2.8 s.
    loadYesterday(wb).then(() => {
      const cur = state.slides[state.currentSlide];
      if (cur && cur.type === 'yesterday') render();
    });
    state.promos = CONFIG.PROMO_URL;
    state.lastRefresh = new Date();
    const keepSlide = state.currentSlide;
    buildSlides();
    state.currentSlide = Math.min(keepSlide, Math.max(0, state.totalSlides - 1));
    if (loading) loading.style.display = 'none';
    render();
    postBoardState('ready');   // first slide is drawn - the frame can lift its card
    startSlideshow();
    if (isUpdate) showToast('📊 Fresh sales report just loaded — numbers updated!');
  } catch(err) {
    console.error(err);
    if (loading) { loading.style.display='flex'; errorMsg.textContent = err.message; errorMsg.style.display = 'block'; retryBtn.style.display = 'block'; }
    postBoardState('error', { reason: String(err && err.message || err).slice(0, 120) });
    if (!state.stores.length) showLocalFallback();
  }
}
function showLocalFallback() {
  const loading = document.getElementById('loading');
  if (!loading) return;
  if (document.getElementById('localUpload')) return;
  const div = document.createElement('div');
  div.id = 'localUpload';
  div.style.cssText = 'margin-top:16px;text-align:center;';
  div.innerHTML = '<p style="color:var(--muted);font-size:14px;font-weight:700;margin-bottom:8px">Or load a local Excel file:</p><input type="file" accept=".xlsx,.xls" style="color:var(--muted);font-size:14px;" onchange="loadLocalFile(event)">';
  loading.appendChild(div);
}
async function loadLocalFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const buf = await file.arrayBuffer();
  await loadSheetJS();   // Perf (2026-09-24): SheetJS now loads on demand
  const wb = XLSX.read(buf, { type: 'array' });
  parseWorkbook(wb);
  await loadYesterday(wb);
  state.lastRefresh = new Date();
  buildSlides();
  document.getElementById('loading').style.display = 'none';
  render();
  postBoardState('ready');
  startSlideshow();
}

// ============ WORKBOOK PARSING (unchanged) ============
function parseWorkbook(wb) {
  // Perf (2026-09-24): sheetRows() = prebuilt JSON rows or sheet_to_json (identical).
  const data = sheetRows(wb, 'Store Rank', { header:1, defval:null });
  if (!data) return;
  let headerRow = -1;
  for (let i = 0; i < Math.min(15, data.length); i++) {
    const row = data[i];
    if (row && row.some(c => c && String(c).trim() === 'Rank') && row.some(c => c && String(c).includes('Store'))) { headerRow = i; break; }
  }
  if (headerRow < 0) return;
  const headers = data[headerRow].map(h => h ? String(h).trim() : '');
  const col = (name) => headers.findIndex(h => h.toLowerCase().includes(name.toLowerCase()));
  const iRank=col('Rank'), iRegion=col('Region'), iStore=col('Store'), iEsop=col('ESOP'),
    iRSD=col('RSD'), iDM=col('DM'), iSM=col('SM'), iGP=col('GP $'),
    iLastGP=headers.findIndex(h=>h.includes('Last Month GP $')),
    iTarget=col('Net Target GP'), iVarTarget=col('Var Target GP'),
    iGPDay=col('GP $ per Day'), iDailyBal=col('Daily Bal'),
    iMobileMTD=col('Mobile MTD'), iNewMob=headers.findIndex(h=>h.includes('New Mobile')),
    iMobTrend=col('Mobile Trend'), iHSI=col('HSI'), iNewRGU=col('NEW RGU'),
    iScore=col('Total Score'), iVideo=col('Video attach');
  const iGPTrend = headers.findIndex(h => h === 'GP $ Trend');
  const iMobileCR = headers.findIndex(h => h.toLowerCase().includes('mobile close rate'));
  const iFiscalCR = headers.findIndex(h => h.toLowerCase().includes('fiscal close rate'));
  const iNonTrad = headers.findIndex(h => h.toLowerCase().includes('non traditional'));
  const iGig = headers.findIndex(h => h && h.toUpperCase().includes('GIG') && h.includes('%') && h.toLowerCase().includes('pts'));
  let iPremium = headers.findIndex(h => h.toLowerCase().includes('mobile plus mix'));
  if (iPremium < 0) iPremium = headers.findIndex(h => h.toLowerCase().includes('plus mix'));
  if (iPremium < 0) iPremium = headers.findIndex(h => h.toLowerCase().includes('premium mix'));
  const iNewToUpg = headers.findIndex(h => h.toUpperCase().includes('NEW TO UPGR'));
  const iAccDev = headers.findIndex(h => h.toLowerCase().includes('accessory') && h.toLowerCase().includes('device') && h.toLowerCase().includes('net'));
  const iNPS = headers.findIndex(h => h.toLowerCase().includes('fiscal nps') && !h.toLowerCase().includes('last'));
  const iTabletMTD = headers.findIndex(h => h.toLowerCase().includes('tablet') && (h.toLowerCase().includes('mtd') || h.toLowerCase().includes('month')));
  const iWatchesMTD = headers.findIndex(h => h.toLowerCase().includes('watch') && (h.toLowerCase().includes('mtd') || h.toLowerCase().includes('month')));

  state.stores = [];
  for (let i = headerRow + 1; i < data.length; i++) {
    const row = data[i];
    if (!row || !row[iRank]) break;
    const rsd = row[iRSD];
    if (!rsd || !String(rsd).includes('Bilbrey')) continue;
    state.stores.push({
      rank: row[iRank], region: row[iRegion] || '', name: row[iStore] || '',
      esop: row[iEsop] || '', dm: row[iDM] || '', sm: row[iSM] || '',
      gp: Number(row[iGP]) || 0,
      gpTrend: Number(row[iGPTrend]) || 0,
      lastGP: iLastGP >= 0 ? Number(row[iLastGP]) || 0 : 0,
      target: Number(row[iTarget]) || 0, varTarget: Number(row[iVarTarget]) || 0,
      gpPerDay: Number(row[iGPDay]) || 0, dailyBal: Number(row[iDailyBal]) || 0,
      mobileCR: Number(row[iMobileCR]) || 0, fiscalCR: Number(row[iFiscalCR]) || 0,
      nonTrad: Number(row[iNonTrad]) || 0, nps: Number(row[iNPS]) || 0,
      premium: Number(row[iPremium]) || 0, mobileMTD: Number(row[iMobileMTD]) || 0,
      newMobile: iNewMob >= 0 ? Number(row[iNewMob]) || 0 : 0,
      mobileTrend: Number(row[iMobTrend]) || 0, hsi: Number(row[iHSI]) || 0,
      gigPct: Number(row[iGig]) || 0, newToUpg: Number(row[iNewToUpg]) || 0,
      accPerDev: Number(row[iAccDev]) || 0, newRGU: Number(row[iNewRGU]) || 0,
      totalScore: Number(row[iScore]) || 0, videoAttach: Number(row[iVideo]) || 0,
      tabletMTD: iTabletMTD >= 0 ? Number(row[iTabletMTD]) || 0 : 0,
      watchesMTD: iWatchesMTD >= 0 ? Number(row[iWatchesMTD]) || 0 : 0,
    });
  }
  state.stores.sort((a, b) => a.rank - b.rank);
  // state.stores is now populated, so a deferred district lookup can resolve.
  applyPendingDistrict();

  // Rep Rank
  const repData = sheetRows(wb, 'Rep Rank', { header:1, defval:null });   // Perf (2026-09-24)
  if (repData) {
    let repHeader = -1;
    for (let i = 0; i < 15; i++) {
      if (repData[i] && repData[i].some(c => c && String(c).trim() === 'Rank') &&
          repData[i].some(c => c && String(c).includes('Employee'))) { repHeader = i; break; }
    }
    if (repHeader >= 0) {
      const rh = repData[repHeader].map(h => h ? String(h).trim() : '');
      const rc = (name) => rh.findIndex(h => h.toLowerCase().includes(name.toLowerCase()));
      const riRank=rc('rank'), riName=rc('employee'), riTitle=rc('title'),
        riLoc=rc('location'), riDM=rc('dm'),
        riGP=rh.findIndex(h=>h.startsWith('GP $')||h.startsWith('GP\n')),
        riMobile=rc('mobile mtd'),
        riPremium=(function(){
          let ix=rh.findIndex(h=>h && h.toLowerCase().includes('mobile plus mix'));
          if(ix<0) ix=rh.findIndex(h=>h && h.toLowerCase().includes('plus mix'));
          if(ix<0) ix=rh.findIndex(h=>h && h.includes('Premium Mix'));
          return ix;
        })(),
        riNPS=rh.findIndex(h=>h.includes('Fiscal NPS')&&!h.includes('Last')),
        riGPHR=rh.findIndex(h=>h.includes('GP/ HR')||h.includes('GP/HR'));
      const riTablet=rh.findIndex(h=>h&&h.toLowerCase().includes('tablet'));
      const riWatches=rh.findIndex(h=>h.toLowerCase().includes('watch') && (h.toLowerCase().includes('mtd') || h.toLowerCase().includes('month')));
      const riWatch=rh.findIndex(h=>h&&h.toLowerCase().includes('watch'));
      const riNewToUpg=rh.findIndex(h=>h&&(h.toLowerCase().includes('new')&&h.toLowerCase().includes('upg')));
      const riGig = rh.findIndex(h => h.toLowerCase().includes('gig') && h.includes('%'));
      const riAccMobile = rh.findIndex(h => h.toLowerCase().includes('access') && (h.toLowerCase().includes('mobile') || h.toLowerCase().includes('per mob')));
      const riBlendedWage = rh.findIndex(h => h.toLowerCase().includes('blended') || (h.toLowerCase().includes('wage') && h.toLowerCase().includes('est')));

      const jeffStoreNames = state.stores.map(s => s.name.toLowerCase());
      state.reps = [];
      for (let i = repHeader + 1; i < repData.length; i++) {
        const row = repData[i];
        if (!row || !row[riRank]) break;
        const loc = String(row[riLoc] || '').toLowerCase();
        if (!jeffStoreNames.includes(loc)) continue;
        state.reps.push({
          rank: row[riRank], name: row[riName] || '', title: row[riTitle] || '',
          store: row[riLoc] || '', dm: row[riDM] || '',
          gp: Number(riGP >= 0 ? row[riGP] : 0) || 0,
          mobile: Number(row[riMobile]) || 0,
          premium: riPremium >= 0 ? Number(row[riPremium]) || 0 : 0,
          nps: riNPS >= 0 ? Number(row[riNPS]) || 0 : 0,
          gphr: riGPHR >= 0 ? Number(row[riGPHR]) || 0 : 0,
          newToUpg: riNewToUpg>=0 ? parseFloat(row[riNewToUpg])||0 : 0,
          gigPct: riGig >= 0 ? Number(row[riGig]) || 0 : 0,
          tabletMTD: riTablet >= 0 ? Number(row[riTablet]) || 0 : 0,
          watchesMTD: (riWatches >= 0 ? Number(row[riWatches]) : (riWatch >= 0 ? Number(row[riWatch]) : 0)) || 0,
          accPerMobile: riAccMobile >= 0 ? Number(row[riAccMobile]) || 0 : 0,
          blendedWage: riBlendedWage >= 0 ? Number(row[riBlendedWage]) || 0 : 0,
        });
      }
      state.reps.sort((a, b) => a.rank - b.rank);
    }
  }

  state.dmRanks      = parseRankSheet(wb, CONFIG.DISTRICT_RANK_SHEET);
  state.regionRanks  = parseRankSheet(wb, CONFIG.REGION_RANK_SHEET);
}

// ============ SLIDE BUILDING (unchanged logic) ============
const DETRACTOR_ROWS_PER_PAGE = 12;
function buildSlides() {
  state.slides = [];
  const visibleStores = filteredStores();

  let primaryStore = null;
  if (state.currentStore && state.currentStore !== 'all') {
    primaryStore = visibleStores.find(s => s.name.toLowerCase() === state.currentStore.toLowerCase());
    if (primaryStore) {
      state.slides.push({ type: 'store-detail', store: primaryStore,
        label: 'YOUR STORE — #' + primaryStore.rank + ' ' + primaryStore.name });
    }
  }

  const storePages = Math.max(1, Math.ceil(visibleStores.length / CONFIG.STORE_CARDS_PER_PAGE));
  for (let i = 0; i < storePages; i++) {
    const label = storePages > 1 ? 'Overview (Pg ' + (i+1) + ')' : 'Store Overview';
    state.slides.push({ type: 'stores', title: 'STORE OVERVIEW', page: i, label });
  }

  const districtsToShow = state.currentDistrict === 'all'
    ? DISTRICTS.filter(d => d.key !== 'all')
    : DISTRICTS.filter(d => d.key === state.currentDistrict);
  for (const dist of districtsToShow) {
    const distStores = state.stores.filter(s => storeMatchesDistrict(s, dist));
    if (!distStores.length) continue;
    state.slides.push({ type: 'yesterday', title: "YESTERDAY'S CONVERSION",
      district: dist, stores: distStores, label: "Yesterday — " + dist.label });
  }

  // Days Since Last NPS Detractor — one slide per district, matched on the
  // feed's districtKey. Dropped wholesale when the feed is missing or stale.
  if (streaksUsable()) {
    for (const dist of districtsToShow) {
      const sorted = streakStoresForDistrict(dist.key);
      if (!sorted.length) continue;
      const meta = (state.streaks.districts || []).find(d => String(d.key) === dist.key) || null;
      const totalPages = Math.max(1, Math.ceil(sorted.length / DETRACTOR_ROWS_PER_PAGE));
      for (let pg = 0; pg < totalPages; pg++) {
        const slice = sorted.slice(pg * DETRACTOR_ROWS_PER_PAGE, (pg + 1) * DETRACTOR_ROWS_PER_PAGE);
        state.slides.push({
          type: 'detractor', title: 'DAYS SINCE THE LAST BAD SURVEY',
          district: dist, rows: slice, allRows: sorted, meta: meta,
          page: pg, totalPages: totalPages,
          label: totalPages > 1 ? `Bad Survey — ${dist.label} (Pg ${pg + 1}/${totalPages})` : `Bad Survey — ${dist.label}`,
        });
      }
    }
  }

  if (state.dmRanks && state.dmRanks.length) {
    state.slides.push({ type: 'dm-rank', title: 'DISTRICT MANAGER RANKINGS', label: 'DM Rankings' });
  }
  if (state.regionRanks && state.regionRanks.length) {
    state.slides.push({ type: 'region-rank', title: 'REGION RANKINGS', label: 'Region Rankings' });
  }

  for (const store of visibleStores) {
    if (primaryStore && store.name === primaryStore.name) continue;
    state.slides.push({ type: 'store-detail', store: store, label: '#' + store.rank + ' ' + store.name });
  }

  const promoSlide   = { type: 'promos',        title: 'DAILY PROMOTIONS',        label: 'Promotions' };
  const pushPromoPair = arr => { if (PROMO_AVAILABLE.promos) arr.push(promoSlide); };
  const N = CONFIG.PROMO_EVERY_N || 4;
  const interleaved = [];
  for (let si = 0; si < state.slides.length; si++) {
    interleaved.push(state.slides[si]);
    if ((si + 1) % N === 0) pushPromoPair(interleaved);
  }
  const last = interleaved[interleaved.length - 1];
  if (interleaved.length === 0 || (last && last.type !== 'promos')) {
    pushPromoPair(interleaved);
  }
  state.slides = interleaved;
  state.totalSlides = state.slides.length;
  state.currentSlide = 0;
}

const PROMO_AVAILABLE = { promos: true };
function probePromos() {
  [['promos', CONFIG.PROMO_URL]].forEach(pair => {
    const key = pair[0], url = pair[1];
    const im = new Image();
    im.onload = function () { if (!PROMO_AVAILABLE[key]) { PROMO_AVAILABLE[key] = true; buildSlides(); } };
    im.onerror = function () { if (PROMO_AVAILABLE[key]) { PROMO_AVAILABLE[key] = false; buildSlides(); } };

}

// Cheap fingerprint of the downloaded workbook so we can tell whether the
// file on GitHub actually changed since the last check.
function bufferSignature(buf) {
  const v = new Uint8Array(buf);
  let h = 0;
  const step = Math.max(1, Math.floor(v.length / 4096));
  for (let i = 0; i < v.length; i += step) h = (h * 31 + v[i]) >>> 0;
  return v.length + ':' + h;
}

function fmtCount(n, dec, pre, suf) {
  const sign = n < 0 ? '-' : '';

// Shrinks any .fit element whose text is wider than its box (a long store
// or rep name) instead of cutting it off. Re-run when the web font lands.
function fitText(root) {
  if (!root) return;
  root.querySelectorAll('.fit').forEach(el => {
    if (el.dataset.fs0) el.style.fontSize = el.dataset.fs0;
    const cs = getComputedStyle(el);
    let fs = parseFloat(cs.fontSize) || 16;
    if (!el.dataset.fs0) el.dataset.fs0 = el.style.fontSize || '';
    const min = parseFloat(el.dataset.min || '14');
    let guard = 30, shrunk = false;
    // Strictly wider than the box: text-overflow shows an ellipsis for even a
    // sub-pixel overflow, so stop only once it truly fits, then leave slack.
    while (el.scrollWidth > el.clientWidth && fs > min && guard--) {
      fs = Math.max(min, fs * 0.94);
      el.style.fontSize = fs.toFixed(1) + 'px';
      shrunk = true;
    }
    if (shrunk && fs > min) el.style.fontSize = Math.max(min, fs * 0.97).toFixed(1) + 'px';
  });
}
if (document.fonts && document.fonts.addEventListener) {
  document.fonts.addEventListener('loadingdone', () => {
    const s = document.querySelector('#slideHost .slide');
    if (s) fitText(s);
  });
}

// One animation loop drives every count on the slide.
let countToken = 0;
function runCountUps(root, delay) {
  const els = Array.prototype.slice.call(root.querySelectorAll('.count'));
  const token = ++countToken;
  if (!els.length) return;
  const items = els.map(el => ({
    el, val: parseFloat(el.dataset.val) || 0, dec: parseInt(el.dataset.dec || '0', 10),
    pre: el.dataset.prefix || '', suf: el.dataset.suffix || '',
  }));
  items.forEach(it => { it.el.textContent = fmtCount(0, it.dec, it.pre, it.suf); });
  const dur = 1400;
  let t0 = null;
  function tick(t) {
    if (token !== countToken) return;
    if (t0 === null) t0 = t + (delay || 0);
    const p = clampN((t - t0) / dur, 0, 1);
    const e = p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
    items.forEach(it => { it.el.textContent = fmtCount(it.val * e, it.dec, it.pre, it.suf); });
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// The page chrome (ticker, control dock) is built once and updated in place;
// only the slide itself is swapped. A new slide arrives behind a stinger - a
// broadcast-style wipe that covers the screen, flashes the next slide's name,
// and pulls away to reveal it while its rows fly in.
const VIEW = { key: null, index: -1, busy: false, covered: false, pending: null, stingN: 0, forceStatic: false, dockSig: null, crawlSig: null };
const STINGS = ['slash', 'blinds', 'slash', 'iris'];
const STING_COVER = 540, STING_TOTAL = 1200;

function slideKey(slide) {
  const y = state.yesterday || {};
  return [
    state.currentSlide, state.totalSlides, slide.type, slide.label || slide.title || '',
    state.dataSig, streakSignature(state.streaks),
    slide.type === 'yesterday' ? [y.loaded, y.date, y.error].join('|') : '',
    state.currentDistrict, state.currentStore, STAGE.h,
  ].join('§');
}

function render() {
  const app = document.getElementById('app');
  if (!app || !state.slides.length) return;
  ensureShell();
  const slide = state.slides[state.currentSlide] || state.slides[0];
  updateChrome(slide);
  const key = slideKey(slide);
  if (key === VIEW.key) return;                 // e.g. pause toggled: chrome only
  const built = buildSlide(slide);
  const prev = VIEW.index;
  const sameIndex = prev === state.currentSlide;
  let mode = VIEW.key === null ? 'intro' : (sameIndex ? 'soft' : 'sting');
  if (VIEW.forceStatic) { mode = 'static'; VIEW.forceStatic = false; }
  if (REDUCE_MOTION && mode === 'sting') mode = 'soft';
  let dir = 1;
  if (prev >= 0 && !sameIndex) {
    const n = state.totalSlides;
    if ((prev - 1 + n) % n === state.currentSlide) dir = -1;
  }
  VIEW.key = key;
  VIEW.index = state.currentSlide;
  if (mode === 'sting') playSting(dir, built);
  else mountSlide(built, mode);
}

function playSting(dir, built) {
  const st = document.getElementById('stinger');
  if (!st) { mountSlide(built, 'soft'); return; }
  if (VIEW.busy) {
    // A second change landed mid-wipe: show the newest slide.
    if (VIEW.covered) mountSlide(built, 'full');
    else VIEW.pending = built;
    return;
  }
  VIEW.busy = true; VIEW.covered = false; VIEW.pending = built;
  const variant = STINGS[VIEW.stingN++ % STINGS.length];
  st.className = '';
  st.setAttribute('data-v', variant);
  const t = st.querySelector('.st-title');
  if (t) t.innerHTML = built.sting;
  void st.offsetWidth;                          // restart the CSS animations
  st.className = 'run' + (dir < 0 ? ' rev' : '');
  setTimeout(() => {
    VIEW.covered = true;
    const b = VIEW.pending; VIEW.pending = null;
    if (b) mountSlide(b, 'full');
  }, STING_COVER);
  setTimeout(() => {
    st.className = '';
    VIEW.busy = false; VIEW.covered = false;
    if (VIEW.pending) { const b = VIEW.pending; VIEW.pending = null; mountSlide(b, 'soft'); }
  }, STING_TOTAL);
}

function mountSlide(b, mode) {
  const host = document.getElementById('slideHost');
  if (!host) return;
  const el = document.createElement('div');
  el.className = 'slide slide-' + b.type + (mode === 'soft' ? ' m-soft' : '') + (mode === 'static' ? ' static' : '');
  if (mode === 'full') el.style.setProperty('--d0', '120ms');
  if (mode === 'intro') el.style.setProperty('--d0', '150ms');
  el.innerHTML = b.html;
  while (host.firstChild) host.removeChild(host.firstChild);
  host.appendChild(el);
  setMark(b.mark);
  fitText(el);
  if (mode === 'static') return;
  void el.offsetWidth;
  el.classList.add('go');
  runCountUps(el, mode === 'full' ? 220 : mode === 'intro' ? 250 : 60);
}

function setMark(text) {
  const m = document.getElementById('bgMark');
  if (!m || m.dataset.t === text) return;
  m.dataset.t = text;
  m.classList.add('swap');
  setTimeout(() => { m.textContent = text; m.classList.remove('swap'); }, 380);
}

function buildSlide(slide) {
  const t = slide.type;
  const distLbl = d => esc((d && d.label) || '');
  if (t === 'stores') {
    const visibleStores = filteredStores();
    const start = slide.page * CONFIG.STORE_CARDS_PER_PAGE;
    return { type: t, html: renderStoreGrid(visibleStores.slice(start, start + CONFIG.STORE_CARDS_PER_PAGE), slide),
      mark: 'Overview', sting: `<small>${esc(getActiveDistrict().label)}</small>Store <b>Overview</b>` };
  }
  if (t === 'store-detail') {
    return { type: t, html: renderStoreDetail(slide.store, slide),
      mark: slide.store.name, sting: `<small>Rank #${esc(slide.store.rank)} in the company</small>${esc(slide.store.name)}` };
  }
  if (t === 'yesterday') {
    return { type: t, html: renderYesterday(slide.district, slide.stores),
      mark: 'Yesterday', sting: `<small>Yesterday's conversion</small>${distLbl(slide.district)}` };
  }
  if (t === 'detractor') {
    return { type: t, html: renderDetractor(slide.district, slide.rows, slide),
      mark: 'Clean Days', sting: `<small>Clean days leaderboard</small>${distLbl(slide.district)}` };
  }
  if (t === 'dm-rank') {
    return { type: t, html: renderRankTable(state.dmRanks, 'dm'),
      mark: 'Standings', sting: `<small>National standings</small>DM <b>Rankings</b>` };
  }
  if (t === 'region-rank') {
    return { type: t, html: renderRankTable(state.regionRanks, 'region'),
      mark: 'Regions', sting: `<small>National standings</small>Region <b>Rankings</b>` };
  }
  return { type: 'promos', html: renderPromoImage(CONFIG.PROMO_URL),
    mark: 'Deals', sting: `<small>Today's deals</small>Daily <b>Promos</b>` };
}

function updateClock() {
  const el = document.getElementById('tkTime');
  if (!el) return;
  const now = new Date();
  el.textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + ' · ' +
    now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
  const d = document.getElementById('tkDay');
  if (d) d.textContent = getDayInfo().name;
}
setInterval(updateClock, 20000);

function updateChrome(slide) {
  updateClock();
  const live = document.getElementById('tkLive');
  if (live) {
    live.className = 'tk-live' + (state.paused ? ' paused' : '');
    live.innerHTML = '<i></i>' + (state.paused ? 'PAUSED' : 'LIVE');
  }
  const c = document.getElementById('tkCount');
  if (c) c.innerHTML = `<b>${state.currentSlide + 1}</b> / ${state.totalSlides}`;
  const sub = document.getElementById('tkSub');
  if (sub) sub.textContent = 'DAILY SALES REPORT · ' + state.stores.length + ' STORES' +
    (state.lastRefresh ? ' · UPDATED ' + state.lastRefresh.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }) : '');
  if (state.paused) { const bar = document.getElementById('countdownBar'); if (bar) bar.style.width = '100%'; }
  updateDock();
  updateCrawl();
}

function updateDock() {
  const dock = document.getElementById('dock');
  if (!dock) return;
  const sig = JSON.stringify([state.currentDistrict, state.currentStore, state.paused, state.stores.length,
    DISTRICTS.map(d => districtCount(d.key)), state.slides.map(s => s.label || s.title || '')]);
  if (sig !== VIEW.dockSig) {
    VIEW.dockSig = sig;
    const activeDist = state.currentDistrict;
    const tabs = DISTRICTS.map(d =>
      `<div class="district-tab${d.key === activeDist ? ' active' : ''}" title="${esc(d.label)}" onclick="setDistrict('${d.key}')">${esc(d.tab || d.label)}<span class="district-count">${districtCount(d.key)}</span></div>`).join('');
    const sorted = state.stores.slice().sort((a, b) => a.name.localeCompare(b.name));
    const activeStore = state.currentStore || 'all';
    const storeOptions = ['<option value="all">All Stores in District</option>']
      .concat(sorted.map(s => `<option value="${esc(s.name)}"${s.name === activeStore ? ' selected' : ''}>${esc(s.name)}</option>`)).join('');
    const slideOptions = state.slides.map((s, i) => `<option value="${i}">${esc(s.label || s.title || 'Slide ' + (i + 1))}</option>`).join('');
    dock.innerHTML = `
      <div class="district-tabs">${tabs}</div>
      <select class="dk-sel store-picker${activeStore !== 'all' ? ' has-selection' : ''}" onchange="this.blur();setStore(this.value)" title="My Store">${storeOptions}</select>
      <div class="dk-sep"></div>
      <button class="ctl-btn" onclick="prevSlide()" title="Previous slide">${ICON.prev}</button>
      <button class="ctl-btn play-pause" onclick="togglePause()" title="${state.paused ? 'Resume slideshow' : 'Pause on this slide'}">${state.paused ? ICON.play : ICON.pause}</button>
      <button class="ctl-btn" onclick="nextSlide()" title="Next slide">${ICON.next}</button>
      <div class="dk-sep"></div>
      <select class="dk-sel slide-select" id="slideSelect" onchange="this.blur();goSlide(parseInt(this.value))">${slideOptions}</select>`;
  }
  const sel = document.getElementById('slideSelect');
  if (sel && String(sel.value) !== String(state.currentSlide)) sel.value = String(state.currentSlide);
}

// The crawl along the bottom: headline facts pulled from the same numbers
// the slides show, for whichever district this TV is set to.
function crawlItems() {
  const items = [];
  const stores = filteredStores();
  if (!stores.length) return items;
  const dist = getActiveDistrict();
  const where = dist.key === 'all' ? 'the market' : dist.label;
  const byRank = stores.slice().sort((a, b) => a.rank - b.rank);
  const best = byRank[0];
  items.push(`<b>#${esc(best.rank)} ${esc(best.name)}</b>leads ${esc(where)} at ${fmtMoney(best.gpTrend)} GP trend this month`);
  const withGoal = stores.filter(s => s.target > 0);
  const atGoal = withGoal.filter(s => s.gpTrend >= s.target).length;
  if (withGoal.length) items.push(`<b>${atGoal} of ${withGoal.length}</b>stores are trending at or above their monthly goal`);
  const pace = withGoal.slice().sort((a, b) => b.gpTrend / b.target - a.gpTrend / a.target)[0];
  if (pace) items.push(`<b>Hottest pace</b>${esc(pace.name)} is running at ${Math.round(pace.gpTrend / pace.target * 100)}% of goal`);
  const names = new Set(stores.map(s => String(s.name).toLowerCase()));
  const reps = state.reps.filter(r => names.has(String(r.store).toLowerCase()));
  if (reps.length) {
    const topRep = reps.slice().sort((a, b) => (a.rank || 9999) - (b.rank || 9999))[0];
    items.push(`<b>Top rep</b>${esc(topRep.name)} (${esc(topRep.store)}) — #${esc(topRep.rank)} in the nation with ${fmtMoney(topRep.gp)} GP`);
    const mob = reps.slice().sort((a, b) => b.mobile - a.mobile)[0];
    if (mob && mob.mobile > 0) items.push(`<b>Most mobile lines</b>${esc(mob.name)} (${esc(mob.store)}) with ${mob.mobile} this month`);
  }
  const y = state.yesterday;
  if (y && y.loaded) {
    const conv = stores.map(s => ({ s, z: y.rows[s.name] })).filter(o => o.z && o.z.traffic >= 15 && o.z.mcr != null)
      .sort((a, b) => b.z.mcr - a.z.mcr)[0];
    if (conv) items.push(`<b>Best conversion yesterday</b>${esc(conv.s.name)} turned ${conv.z.mcr.toFixed(1)}% of its traffic into mobile sales`);
  }
  if (streaksUsable()) {
    const keys = dist.key === 'all' ? null : dist.key;
    const live = state.streaks.stores.filter(r => (!keys || String(r.districtKey) === keys) && r.status !== 'no-data' && r.days != null && !r.windowLimited)
      .sort((a, b) => b.days - a.days)[0];
    if (live) items.push(`<b>Longest clean streak</b>${esc(live.store)} — ${live.days} day${live.days === 1 ? '' : 's'} since the last bad survey`);
  }
  const ours = (state.regionRanks || []).filter(r => CONFIG.OUR_REGIONS.some(o => String(r.name).toLowerCase().includes(o.toLowerCase())));
  if (ours.length) items.push(`<b>Region standings</b>` + ours.map(r => `${esc(r.name)} #${r.rank}`).join(' · ') + ` of ${state.regionRanks.length}`);
  return items;
}
function updateCrawl() {
  const track = document.getElementById('tkTrack');
  if (!track) return;
  const y = state.yesterday || {};
  const sig = [state.dataSig, state.currentDistrict, y.loaded, streakSignature(state.streaks)].join('|');
  if (sig === VIEW.crawlSig) return;
  VIEW.crawlSig = sig;
  const items = crawlItems();
  if (!items.length) { track.innerHTML = ''; return; }
  const one = items.map(t => `<span class="tk-item">${t}</span>`).join('');
  track.innerHTML = one + one;                 // two copies: the loop is seamless
  requestAnimationFrame(() => {
    const w = track.scrollWidth / 2;
    track.style.setProperty('--crawl-dur', Math.max(30, w / 95).toFixed(1) + 's');
  });
}
