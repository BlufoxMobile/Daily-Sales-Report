function renderStoreDetail(s, slide) {
  const storeReps = state.reps.filter(r => r.store.toLowerCase() === s.name.toLowerCase());
  storeReps.sort((a, b) => (a.rank || 9999) - (b.rank || 9999));
  const yours = !!(slide && String(slide.label || '').indexOf('YOUR STORE') === 0);
  const n = storeReps.length;

  // Team rows share the panel height: big for a small crew, never overflowing for 12+.
  const H = bodyH(false);
  const avail = H - 40 - 44 - 60 - 10;
  const gap = n > 10 ? 5 : 7;
  const rowH = Math.floor(Math.min(136, (avail - gap * Math.max(0, n - 1)) / Math.max(1, n)));
  const nmSz = Math.round(clampN(rowH * 0.46, 20, 50));
  const numSz = Math.round(clampN(rowH * 0.42, 20, 46));
  // Number columns get exactly the width their widest figure needs at this
  // size (Archivo 900 @ 62.5%: digits ~.45em); the rep name takes the rest.
  const emW = s => { let w = 0; for (const ch of String(s)) w += (ch === '.' || ch === ',') ? 0.23 : ch === '$' ? 0.41 : ch === '%' ? 0.42 : ch === '#' ? 0.28 : 0.46; return w; };
  const colW = (strs, lbl, sz) => Math.ceil(Math.max(strs.reduce((m, x) => Math.max(m, emW(x) * (sz || numSz)), 0), lbl * 12.2)) + 6;
  const pcts = k => storeReps.map(r => pctStr(r[k]));
  const wRank = colW(storeReps.map(r => '#' + r.rank), 5, numSz * 0.9);
  const wGp   = colW(storeReps.map(r => fmtMoney(r.gp)), 4);
  const wPl   = colW(pcts('premium'), 6);
  const wGig  = colW(pcts('gigPct'), 5);
  const wXm   = Math.max(62, colW(storeReps.map(r => String(r.mobile)), 2));
  const wTab  = Math.max(62, colW(storeReps.map(r => String(r.tabletMTD || 0)), 3));
  const wW    = Math.max(72, colW(storeReps.map(r => String(r.watchesMTD || 0)), 5));
  const wWage = colW(storeReps.map(r => r.blendedWage > 0 ? '$' + Number(r.blendedWage).toFixed(2) : '—'), 9);
  const cols = `grid-template-columns:${Math.max(wRank, Math.round(rowH * 0.62) + 4)}px minmax(0,1fr) ${wGp}px ${wPl}px ${wGig}px ${wXm}px ${wTab}px ${wW}px ${wWage}px;column-gap:14px`;
  const maxGp = storeReps.reduce((m, r) => Math.max(m, r.gp), 0) || 1;
  const plusCls = v => v >= 0.85 ? 'c-good' : v >= 0.7 ? 'c-warn' : 'c-low';

  const repRows = storeReps.map((r, i) => `
      <div class="tr tgrid${i === 0 ? ' lead sweep' : ''} ki ki-r" style="${cols};--i:${i + 4};height:${rowH}px;margin-top:${i ? gap : 0}px">
        ${i === 0 ? '<i class="sw"></i>' : ''}
        <span class="rk-cell" style="font-size:${Math.round(numSz * 0.9)}px">${Number(r.rank) >= 1 && Number(r.rank) <= 3 ? `<span class="med m${Number(r.rank)}" style="width:${Math.round(rowH * 0.62)}px;height:${Math.round(rowH * 0.62)}px;font-size:${Math.round(rowH * 0.34)}px">${Number(r.rank)}</span>` : `<span class="rkn"><em>#</em>${esc(r.rank)}</span>`}</span>
        <span class="t-nm fit" data-min="16" style="font-size:${nmSz}px">${esc(r.name)}</span>
        <span class="t-v t-gp num" style="font-size:${numSz}px">${moneyHtml(r.gp)}<span class="gbar"><i style="--p:${clampN(r.gp / maxGp, 0, 1).toFixed(4)}"></i></span></span>
        <span class="t-v num ${plusCls(r.premium)}" style="font-size:${numSz}px">${pctHtml(r.premium)}</span>
        <span class="t-v num" style="font-size:${numSz}px">${pctHtml(r.gigPct)}</span>
        <span class="t-v num${r.mobile ? '' : ' c-mut'}" style="font-size:${numSz}px">${cnt(r.mobile)}</span>
        <span class="t-v num${r.tabletMTD ? '' : ' c-mut'}" style="font-size:${numSz}px">${cnt(r.tabletMTD || 0)}</span>
        <span class="t-v num${r.watchesMTD ? '' : ' c-mut'}" style="font-size:${numSz}px">${cnt(r.watchesMTD || 0)}</span>
        <span class="t-v t-wage num" style="font-size:${numSz}px">${r.blendedWage > 0 ? cnt(Number(r.blendedWage), { dec: 2, pre: '$' }) : '—'}</span>
      </div>`).join('');

  return `
    <div class="sb"><div class="sd">
      <div class="sd-left">
        <div class="sd-kicks">
          <div class="kick ki ki-l" style="--i:0">Rank #${esc(s.rank)} in the company</div>
          ${yours ? '<div class="kick ghost ki ki-l" style="--i:1">Your store</div>' : ''}
        </div>
        <div class="sd-name fit ki ki-zoom" data-min="56" style="--i:1">${esc(s.name)}</div>
        <div class="sd-sub fit ki ki-up" style="--i:2">${esc(s.region)} · SM <b>${esc(s.sm || '—')}</b> · DM <b>${esc(s.dm || '—')}</b></div>
        <div class="sd-gp ki ki-up" style="--i:3">
          <div style="min-width:0;flex:0 1 auto"><div class="lbl">GP trend this month</div><div class="money num fit" data-min="70">${moneyHtml(s.gpTrend)}</div></div>
          ${deltaHtml(s.varTarget)}
        </div>
        <div class="ki ki-up" style="--i:4">${goalHtml(s.gpTrend, s.target, 'Monthly goal')}</div>
        <div class="sd-dev">
          <div class="dev hot ki ki-pop" style="--i:5"><span class="lbl">Total RGU</span><span class="num">${cnt(s.newRGU)}</span></div>
          <div class="dev ki ki-pop" style="--i:6"><span class="lbl">Mobile</span><span class="num">${cnt(s.mobileMTD)}</span></div>
          <div class="dev ki ki-pop" style="--i:7"><span class="lbl">Tablets</span><span class="num">${cnt(s.tabletMTD)}</span></div>
          <div class="dev ki ki-pop" style="--i:8"><span class="lbl">Watches</span><span class="num">${cnt(s.watchesMTD)}</span></div>
        </div>
        <div class="sd-kpis">${storeKpis(s, 9)}</div>
      </div>
      <div class="tp plate ki ki-r" style="--i:2">
        <div class="tp-head"><div class="kick">Team Leaderboard</div><div class="sh-sub">Ranked by national standing — GP, Plus mix, GIG, devices sold &amp; estimated wage</div></div>
        <div class="tgrid tcols" style="${cols}">
          <span>Nat'l</span><span>Rep Name</span><span>GP $</span><span>Plus %</span><span>GIG %</span><span>XM</span><span>Tab</span><span>Watch</span><span>Est. Wage</span>
        </div>
        <div class="trows">${repRows || '<div class="panel-note">No team data available.</div>'}</div>
      </div>
    </div></div>`;
}

function renderYesterday(district, distStores) {
  const y = state.yesterday;
  const head = sub => slideHead("Yesterday's Conversion",
    esc(district.label) + (y && y.date ? ` <em>· ${esc(fmtIsoShort(y.date) || y.date)}</em>` : ''), sub);
  if (!y || (!y.loaded && !y.error)) {
    return head(SLIDE_SUBTITLES.yesterday) + '<div class="sb"><div class="yb plate ki ki-up" style="--i:2"><div class="panel-note">Loading yesterday\'s data…</div></div></div>';
  }

  // ---- data (same sources, same maths as before) ----------------------------
  const rows = distStores.map(s => {
    const z = y.rows[s.name] || {};
    const traffic = z.traffic || 0;
    const mobile  = z.mobile  || 0;
    const mcr     = (z.mcr != null) ? z.mcr : null;
    const tcharts = (y.tsheets && y.tsheets[s.name]) || 0;
    // T-Charts are shown as a share of traffic — how much of the door we
    // actually put on a chart — not as a raw count.
    const tpct = traffic > 0 ? (tcharts / traffic * 100) : null;
    return { name: s.name, traffic, mobile, mcr, tcharts, tpct };
  });
  const tot = rows.reduce((a, r) => ({
    traffic: a.traffic + r.traffic,
    mobile:  a.mobile  + r.mobile,
    tcharts: a.tcharts + r.tcharts
  }), { traffic: 0, mobile: 0, tcharts: 0 });
  const totMcr = tot.traffic > 0 ? (tot.mobile / tot.traffic * 100) : null;
  const totTpct = tot.traffic > 0 ? (tot.tcharts / tot.traffic * 100) : null;
  const fmtN = v => Number(v || 0).toLocaleString('en-US');
  const fmtR = v => (v == null) ? '—' : v.toFixed(1);
  const all = rows.concat([{ name: 'District Total', traffic: tot.traffic, mobile: tot.mobile, mcr: totMcr, tcharts: tot.tcharts, tpct: totTpct }]);

  const sub = tot.traffic > 0
    ? `<b>${fmtN(tot.traffic)}</b> people came through the door yesterday — <b>${fmtN(tot.mobile)}</b> of them walked out as mobile customers.`
    : 'No traffic recorded yesterday.';

  // ---- size ladder: every band (stores + total) splits the board height ----
  const bands = Math.max(1, rows.length) + 1;
  const avail = bodyH() - 38 - 36 - 12;
  const gapY = bands <= 6 ? 12 : bands <= 9 ? 9 : 7;
  const rowH = Math.floor(Math.min(170, (avail - gapY * (bands - 1)) / bands));
  const num = Math.round(clampN(rowH * 0.66, 26, 112));
  const hero = Math.round(clampN(rowH * 0.8, 30, 132));
  const nameSz = Math.round(clampN(rowH * 0.62, 22, 104));
  // Archivo 900 at 62.5% width: digits ~0.45em, separators ~0.22em, the
  // small % ~0.41em. Columns get exactly what their widest figure needs.
  const strW = (s, size) => { let w = 0; for (const ch of String(s)) w += (ch === '.' || ch === ',') ? 0.23 : 0.46; return w * size; };
  const maxW = (arr, size) => arr.reduce((m, s) => Math.max(m, strW(s, size)), 0);
  const lblW = s => s.length * 16.5 + 10;
  const pad = 30;
  const wT = Math.round(Math.max(maxW(all.map(r => fmtN(r.traffic)), num), lblW('TRAFFIC'))) + pad;
  const wM = Math.round(Math.max(maxW(all.map(r => fmtN(r.mobile)), num), lblW('MOBILE SALES'))) + pad;
  const wC = Math.round(Math.max(maxW(all.map(r => fmtR(r.mcr)), hero) + 0.44 * hero, lblW('CONVERSION'))) + pad + 20;
  const wK = Math.round(Math.max(maxW(all.map(r => fmtR(r.tpct)), num) + 0.44 * num, lblW('T-CHART %'))) + pad;
  const vars = `--ycols:minmax(0,1fr) ${wT}px ${wM}px ${wC}px ${wK}px;--yrow:${rowH}px;--yrgap:${gapY}px;--ynum:${num}px;--yhero:${hero}px;--yname:${nameSz}px;`;

  const rateClass = v => (v == null) ? 'c-mut' : (v >= 10 ? 'c-good' : (v >= 6 ? 'c-warn' : 'c-low'));
  const pctCell = (v, isHero, cls) => {
    if (v == null) return `<div class="yv num${isHero ? ' hero' : ''} soft"><span class="yl"><span class="dash">—</span></span></div>`;
    // Conversion bar runs to 15% with a tick at the 10% "good" line;
    // T-Chart bar runs to 100% of the door.
    const p = isHero ? clampN(v / 15, 0, 1) : clampN(v / 100, 0, 1);
    return `<div class="yv num${isHero ? ' hero' : ''} ${cls || ''}"><span class="yl">${cnt(Number(v.toFixed(1)), { dec: 1 })}<small>%</small></span><span class="ybar"><i style="--p:${p.toFixed(4)}"></i>${isHero ? '<b></b>' : ''}</span></div>`;
  };
  const band = (r, i, isTotal) => `
      <div class="yr ygrid${isTotal ? ' total sweep' : ''} ki ${isTotal ? 'ki-up' : 'ki-l'}" style="--i:${i + 3}">
        ${isTotal ? '<i class="sw"></i>' : ''}
        <div class="yn fit" data-min="20">${esc(r.name)}</div>
        <div class="yv num${r.traffic ? '' : ' soft'}">${cnt(r.traffic)}</div>
        <div class="yv num${r.mobile ? '' : ' soft'}">${cnt(r.mobile)}</div>
        ${pctCell(r.mcr, true, rateClass(r.mcr))}
        ${pctCell(r.tpct, false, r.tpct ? '' : 'soft')}
      </div>`;
  const rowsHtml = rows.map((r, i) => band(r, i, false)).join('') + band(all[all.length - 1], rows.length, true);

  return head(sub) + `
    <div class="sb"><div class="yb plate" style="${vars}">
      <div class="yh ygrid ki ki-drop" style="--i:2">
        <span>Store</span><span>Traffic</span><span>Mobile Sales</span><span class="hero">Conversion</span><span>T-Chart %</span>
      </div>
      <div class="yrows">${rows.length ? rowsHtml : '<div class="y-empty">No stores in this district.</div>'}</div>
    </div></div>`;
}

function renderDetractor(district, rows, slide) {
  const feed = state.streaks || {};
  const meta = slide.meta || {};
  const goal = Number(feed.goalDays) || STREAK_GOAL_FALLBACK;
  const all = slide.allRows || rows;
  // The producer leaves window-limited stores out of the district maths (their
  // number is bounded by their own survey history, not by an observed clean
  // run) — the local fallbacks below mirror that.
  const live = all.filter(r => r.status !== 'no-data' && r.days != null && !r.windowLimited);
  const avgDays = meta.avgDays != null ? Number(meta.avgDays)
    : (live.length ? live.reduce((a, r) => a + Number(r.days || 0), 0) / live.length : 0);
  const bestDays = meta.bestDays != null ? Number(meta.bestDays)
    : (live.length ? Math.max.apply(null, live.map(r => Number(r.days || 0))) : 0);
  const bestStore = meta.bestStore || (live.length ? live[0].store : '—');
  const goalMetCount = meta.goalMetCount != null ? Number(meta.goalMetCount)
    : live.filter(r => r.goalMet || r.capped || Number(r.days) >= goal).length;
  const hasRanked = live.length > 0;
  const avgTxt = (meta.avgDays != null || hasRanked) ? `${avgDays.toFixed(1)} <em>days</em>` : '—';
  const bestTxt = (meta.bestStore || hasRanked) ? `${esc(bestStore)} · <em>${bestDays} days</em>` : '—';
  const asOf = fmtStreakDate(feed.asOf);
  const pageInfo = slide.totalPages > 1 ? ` <em>· Page ${slide.page + 1} of ${slide.totalPages}</em>` : '';

  // Podium: ranks are shared on ties, so a medal is only awarded when the whole
  // tied group still fits inside the top three ranked rows.
  const rankGroups = {};
  all.filter(r => r.rankDistrict != null && !r.windowLimited).forEach((r, idx) => {
    const k = String(r.rankDistrict);
    if (!rankGroups[k]) rankGroups[k] = { start: idx, count: 0 };
    rankGroups[k].count++;
  });
  const n = Math.max(1, rows.length);
  const avail = bodyH() - 96 - 16;
  const gap = n <= 5 ? 12 : n <= 8 ? 9 : 6;
  const rowH = Math.floor(Math.min(150, (avail - gap * (n - 1)) / n));
  const medSz = Math.round(clampN(rowH * 0.62, 34, 86));
  const rankBadge = rank => {
    const g = rankGroups[String(rank)];
    if (rank >= 1 && rank <= 3 && g && g.start + g.count <= 3) {
      return `<span class="med m${rank}" style="width:${medSz}px;height:${medSz}px;font-size:${Math.round(medSz * 0.55)}px">${rank}</span>`;
    }
    return `<span class="rkn" style="font-size:${Math.round(medSz * 0.7)}px"><em>#</em>${rank}</span>`;
  };

  const cnum = Math.round(clampN(rowH * 0.9, 40, 140));
  const cname = Math.round(clampN(rowH * 0.6, 28, 92));
  const segs = Math.max(5, Math.min(40, goal));
  const trackW = rowH >= 90 ? 380 : 300;
  const numW = Math.round(cnum * 1.45 + clampN(cnum * 0.2, 14, 26) * 3.4);
  const dateW = Math.round(clampN(rowH * 1.45, 150, 200));
  const vars = `--ccols:${Math.round(medSz * 1.35)}px minmax(0,1fr) ${trackW}px ${numW}px ${dateW}px;--crow:${rowH}px;--cgap:${gap}px;` +
    `--cnum:${cnum}px;--cname:${cname}px;--cunit:${Math.round(clampN(cnum * 0.2, 14, 26))}px;--cdate:${Math.round(clampN(rowH * 0.19, 15, 24))}px;` +
    `--cflag:${Math.round(clampN(cname * 0.26, 12, 18))}px;--ctrack:${Math.round(clampN(rowH * 0.28, 16, 34))}px;`;

  // 0-5 red · 6-10 amber · 11-19 green · 20+ gold. A store that has hit the
  // company goal is never shown as anything less than gold.
  const tierFor = (days, atGoal) => {
    if (atGoal || days >= 20) return 'gold';
    if (days >= 11) return 'green';
    if (days >= 6) return 'amber';
    return 'red';
  };

  const rowsHtml = rows.map((r, i) => {
    const name = esc(r.store || r.storeFull || '');
    if (r.status === 'no-data' || r.days == null) {
      return `
      <div class="cr t-none ki ki-l" style="--i:${i + 3}">
        <span class="c-rk"><span class="rkn" style="font-size:${Math.round(medSz * 0.7)}px">—</span></span>
        <span class="c-nm"><span class="fit" data-min="20">${name}</span></span>
        <span class="c-note">Awaiting survey data</span>
      </div>`;
    }
    const days = Number(r.days) || 0;
    const limited = !!r.windowLimited;
    const goalMet = !limited && (r.goalMet === true ||
      (r.goalPending !== true && (r.capped === true || r.atGoal === true || days >= goal)));
    const goalPending = !limited && !goalMet && r.goalPending === true;
    const atGoal = goalMet || goalPending || r.atGoal === true || days >= goal;
    const tier = limited ? 'neutral' : tierFor(days, atGoal);
    const gold = tier === 'gold';
    const rank = r.rankDistrict != null ? r.rankDistrict : (slide.page * DETRACTOR_ROWS_PER_PAGE + i + 1);
    const lastDate = fmtStreakDate(r.lastDetractorDate);
    const since = fmtStreakDate(r.trackingSince);
    const dateLabel = (limited && since) ? 'Clean since' : 'Last bad survey';
    const dateTxt = lastDate ? esc(lastDate) : (limited && since) ? esc(since) : 'None yet';
    const lit = Math.round(clampN(days / goal, 0, 1) * segs);
    let track = '';
    for (let k = 0; k < segs; k++) track += `<i class="${k < lit ? 'on' : ''}" style="--s:${k}"></i>`;
    return `
      <div class="cr t-${tier} ki ki-l" style="--i:${i + 3}">
        ${gold ? '<i class="shine"></i>' : ''}
        <span class="c-rk">${limited ? `<span class="rkn" style="font-size:${Math.round(medSz * 0.7)}px">—</span>` : rankBadge(rank)}</span>
        <span class="c-nm"><span class="fit" data-min="22">${name}</span>${gold ? CROWN_SVG : ''}${limited ? '<span class="c-flag">NOT RANKED YET</span>' : ''}</span>
        <span class="c-track">${track}</span>
        <span class="c-num"><span class="num">${cnt(days)}</span><span class="unit">DAY${days === 1 ? '' : 'S'}</span></span>
        <span class="c-date"><span>${dateLabel}</span>${dateTxt}</span>
      </div>`;
  }).join('');

  const legend = `<div class="cd-legend ki ki-r" style="--i:2">
      <span class="lg red"><i></i>0–5</span><span class="lg amber"><i></i>6–10</span>
      <span class="lg green"><i></i>11–19</span><span class="lg gold"><i></i>20+ DAYS</span></div>`;
  return `
    <div class="sh">
      <div class="kick ki ki-l" style="--i:0">Clean Days Leaderboard</div>
      <div class="sh-title ki ki-l" style="--i:1">${esc(district.label)}${asOf ? ` <em>· As of ${esc(asOf)}</em>` : ''}${pageInfo}</div>
      <div style="margin-left:auto">${legend}</div>
    </div>
    <div class="sb"><div class="cd" style="${vars}">
      <div class="cd-list">${rowsHtml}</div>
      <div class="cd-foot" style="grid-template-columns:1.25fr 1fr 1fr 1fr">
        <div class="stat ki ki-up" style="--i:${rows.length + 3}"><div class="lbl">The rule</div><div style="font-size:20px;font-weight:700;color:var(--mut);line-height:1.25;margin-top:4px">A bad survey is any survey scored 8 or below — every store is chasing <b style="color:var(--ink)">${goal} clean days</b> in a row.</div></div>
        <div class="stat plate ki ki-up" style="--i:${rows.length + 4}"><div class="lbl">District average</div><div class="v">${avgTxt}</div></div>
        <div class="stat plate ki ki-up" style="--i:${rows.length + 5}"><div class="lbl">Longest streak</div><div class="v">${bestTxt}</div></div>
        <div class="stat plate ki ki-up" style="--i:${rows.length + 6}"><div class="lbl">At ${goal}+ days</div><div class="v">${goalMetCount} <em>of ${all.length} stores</em></div></div>
      </div>
    </div></div>`;
}

function renderRankTable(rows, kind) {
  const sorted = rows.slice().sort((a, b) => a.rank - b.rank);
  const ourDMs = new Set(state.stores.map(s => String(s.dm || '').toLowerCase().trim()).filter(Boolean));
  const isMine = (name) => {
    const n = String(name).toLowerCase().trim();
    if (kind === 'region') return CONFIG.OUR_REGIONS.some(r => n.includes(r.toLowerCase()));
    if (ourDMs.has(n)) return true;
    for (const dm of ourDMs) { if (dm.includes(n) || n.includes(dm)) return true; }
    return false;
  };
  const mobInt = v => Math.abs(v) <= 1.5 && v !== 0 ? Number(v).toFixed(2) : Math.round(v);
  const twoCol = sorted.length > 12;
  const perCol = twoCol ? Math.ceil(sorted.length / 2) : sorted.length;
  const avail = bodyH() - 30 - (twoCol ? 44 : 30) - 8;
  const gap = twoCol ? 5 : 8;
  const rowH = Math.floor(Math.min(twoCol ? 70 : 100, (avail - gap * (perCol - 1)) / Math.max(1, perCol)));
  const nmSz = Math.round(clampN(rowH * (twoCol ? 0.46 : 0.5), 17, 52));
  const numSz = Math.round(clampN(rowH * (twoCol ? 0.44 : 0.48), 17, 48));
  const cols = twoCol
    ? 'grid-template-columns:52px minmax(0,1fr) 84px 44px 60px 66px 66px 66px 66px 70px;column-gap:9px'
    : 'grid-template-columns:110px minmax(0,1fr) 170px 110px 130px 150px 150px 140px 140px 140px;column-gap:18px';
  const labels = twoCol
    ? ['Rank', kind === 'region' ? 'Region' : 'District Manager', 'GP<br>Trend', 'Mob/<br>Int', 'GP/<br>RGU', 'Fiscal<br>CR', 'Mobile<br>CR', 'GIG<br>%', 'Plus<br>%', 'NPS']
    : ['Rank', kind === 'region' ? 'Region' : 'District Manager', 'GP Trend', 'Mob/Int', 'GP/RGU', 'Fiscal CR', 'Mobile CR', 'GIG %', 'Plus %', 'NPS'];
  const medSz = Math.round(clampN(rowH * 0.7, 30, 64));
  const rowHtml = (r, i) => {
    const mine = isMine(r.name);
    const rk = r.rank >= 1 && r.rank <= 3
      ? `<span class="med m${r.rank}" style="width:${medSz}px;height:${medSz}px;font-size:${Math.round(medSz * 0.55)}px">${r.rank}</span>`
      : `<span class="rkn" style="font-size:${numSz}px"><em>#</em>${r.rank}</span>`;
    return `
      <div class="rr tgrid${mine ? ' mine' : ''} ki ki-l" style="${cols};--i:${Math.min(i, 16) + 3};height:${rowH}px">
        <span>${rk}</span>
        <span class="r-nm" style="font-size:${nmSz}px"><span class="fit" data-min="14">${esc(r.name)}</span>${mine ? STAR_SVG : ''}</span>
        <span class="r-v num" style="font-size:${numSz}px">${moneyHtml(r.avgGpTrend)}</span>
        <span class="r-v num" style="font-size:${numSz}px">${mobInt(r.mobilePerInternet)}</span>
        <span class="r-v num" style="font-size:${numSz}px">${fmtMoney(r.gpPerRgu)}</span>
        <span class="r-v num" style="font-size:${numSz}px">${smartPct(r.fiscalCr)}</span>
        <span class="r-v num" style="font-size:${numSz}px">${smartPct(r.mobileCr)}</span>
        <span class="r-v num" style="font-size:${numSz}px">${smartPct(r.gigAttach)}</span>
        <span class="r-v num" style="font-size:${numSz}px">${smartPct(r.plusAttach)}</span>
        <span class="r-v num" style="font-size:${numSz}px">${smartPct(r.nps)}</span>
      </div>`;
  };
  const panel = (list, off, pi) => `
      <div class="rkp plate ki ki-up" style="--i:${pi + 2}">
        <div class="rhead tgrid" style="${cols};${twoCol ? 'line-height:1.1' : ''}">${labels.map(l => `<span>${l}</span>`).join('')}</div>
        <div class="rkrows" style="--rgap:${gap}px">${list.map((r, i) => rowHtml(r, i + off)).join('')}</div>
      </div>`;
  const body = twoCol
    ? `<div class="rk2">${panel(sorted.slice(0, perCol), 0, 0)}${panel(sorted.slice(perCol), perCol, 1)}</div>`
    : `<div style="height:100%;display:flex;flex-direction:column">${panel(sorted, 0, 0).replace('class="rkp plate', 'class="rkp solo plate')}</div>`;
  const title = kind === 'region' ? 'Region Rankings' : 'District Manager Rankings';
  const sub = kind === 'region'
    ? 'How the regions stack up — ours are highlighted with a star'
    : 'How all district managers stack up across the company — ours are starred';
  return slideHead('National Standings', title, sub) + `<div class="sb">${body}</div>`;
}

function renderPromoImage(url) {
  return slideHead('Daily Promotions', "Today's deals to lead with", '') + `
    <div class="sb"><div class="promo">
      <div class="promo-frame ki ki-pop" style="--i:2">
        <img src="${url}?t=${Math.floor(Date.now() / 600000)}" alt="Promotion" onerror="promoMissing(this)">
        <i class="brk tl"></i><i class="brk tr"></i><i class="brk bl"></i><i class="brk br"></i>
      </div>
    </div></div>`;
}
function promoMissing(img) {
  img.parentElement.innerHTML = '<div class="promo-missing">Promo card hasn\'t been uploaded yet.<span>Add the image to the data folder in the repo.</span></div>';
}

// ============ SLIDESHOW CONTROL (with pause) ============
// Perf (2026-09-24): SITE PAUSE. cookcountycooks.com hides the Break Room TV
// (this report, framed) with display:none while a tool is open over it. That
// stops painting but not the 15 s slide timer or the 100 ms countdown timer
// (~25 ms/s of main-thread work behind the tool). The framing page may post
//   { source: 'ccc-site', action: 'pause' }   and later
//   { source: 'ccc-site', action: 'resume' }
// Paused, both timers stop; resume restarts the slideshow on the slide that
// was showing. Only the parent frame is listened to, so the report on its own
// (not framed) is unaffected, and a report that is never told keeps running.
let sitePaused = false;
let siteHeldShow = false;   // the slideshow was running (or asked to start) while paused
window.addEventListener('message', e => {
  if (window.parent === window || e.source !== window.parent) return;
  const d = e.data;
  if (!d || typeof d !== 'object' || d.source !== 'ccc-site') return;
  if (d.action === 'pause' && !sitePaused) {
    sitePaused = true;
    siteHeldShow = !!(state.slideTimer || state.countdownTimer);
    clearInterval(state.slideTimer); state.slideTimer = null;
    clearInterval(state.countdownTimer); state.countdownTimer = null;
  } else if (d.action === 'resume' && sitePaused) {
    sitePaused = false;
    if (siteHeldShow) startSlideshow();
  }
});
function startSlideshow() {
  if (state.slideTimer) { clearInterval(state.slideTimer); state.slideTimer = null; }
  if (sitePaused) { siteHeldShow = true; return; }   // Perf (2026-09-24): see SITE PAUSE
  if (!state.paused) {
    state.slideTimer = setInterval(() => {
      state.currentSlide = (state.currentSlide + 1) % state.totalSlides;
      render();
      startCountdown();
    }, CONFIG.SLIDE_INTERVAL);
  }
  startCountdown();
}
function startCountdown() {
  if (state.countdownTimer) clearInterval(state.countdownTimer);
  if (sitePaused) { state.countdownTimer = null; return; }   // Perf (2026-09-24): see SITE PAUSE
  state.countdownStart = Date.now();
  state.countdownTimer = setInterval(() => {
    const bar = document.getElementById('countdownBar');
    if (!bar) return;
    if (state.paused) { bar.style.width = '100%'; return; }
    const elapsed = Date.now() - state.countdownStart;
    bar.style.width = Math.max(0, 100 - (elapsed / CONFIG.SLIDE_INTERVAL * 100)) + '%';
  }, 100);
}
function goSlide(i) {
  if (!state.totalSlides) return;
  state.currentSlide = ((i % state.totalSlides) + state.totalSlides) % state.totalSlides;
  render();
  startSlideshow();
}
function nextSlide() { goSlide(state.currentSlide + 1); }
function prevSlide() { goSlide(state.currentSlide - 1); }
function togglePause() {
  state.paused = !state.paused;
  render();
  startSlideshow();
}

// ============ FIT ANY SCREEN ============
// The canvas is always 1920 wide; its height follows the screen's shape
// between 16:9 (1080) and 4:3 (1440), so a 16:10 laptop or a 4:3 iPad is
// filled edge to edge instead of letterboxed. Wider-than-16:9 screens keep
// 1080 and pillarbox. A height change redraws the slide in place.
function fitStage() {
  const vw = window.innerWidth || 1920, vh = window.innerHeight || 1080;
  const h = Math.round(Math.max(1080, Math.min(1440, 1920 * vh / vw)));
  const s = Math.min(vw / 1920, vh / h);
  const sc = document.getElementById('stage-scaler');
  sc.style.height = h + 'px';
  sc.style.transform = `translate(-50%,-50%) scale(${s})`;
  document.documentElement.style.setProperty('--sh', h + 'px');
  if (h !== STAGE.h) {
    STAGE.h = h;
    if (state.slides.length && VIEW.key !== null) { VIEW.forceStatic = true; render(); }
  }
}

// ============ CONTROL DOCK: rises on activity, tucks away when idle ============
let idleTimer = null;
function wakeControls() {
  const d = document.getElementById('dock');
  if (d) d.classList.add('awake');
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    const d2 = document.getElementById('dock');
    if (!d2) return;
    if (d2.matches(':hover')) { wakeControls(); return; }
    d2.classList.remove('awake');
  }, 7000);
}
['mousemove','mousedown','touchstart','keydown'].forEach(ev =>
  document.addEventListener(ev, wakeControls, { passive: true }));

// ============ KEYBOARD ============
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  else if (e.key === 'ArrowRight') nextSlide();
  else if (e.key === 'ArrowLeft') prevSlide();
  else if (e.key === 'r' || e.key === 'R') { state.dataSig = null; loadData(); }
});
// Perf (2026-09-24): KEYS FOR THE SITE. Framed in cookcountycooks.com's tool
// viewer, a key pressed in this report never reaches the site, so Escape could
// not close the viewer and Ctrl-K / Cmd-K could not open its Find. When framed,
// those two keys go to the parent as { source: 'ccc-tool', action: 'escape' |
// 'find' } - only when this page did not use the key itself. Not framed: no-op.
if (window.parent !== window) window.addEventListener('keydown', e => {
  if (e.defaultPrevented || e.isComposing) return;
  const k = e.key, mod = e.metaKey || e.ctrlKey;
  const action = (k === 'Escape' && !mod && !e.altKey && !e.shiftKey) ? 'escape'
    : (mod && !e.altKey && !e.shiftKey && (k === 'k' || k === 'K')) ? 'find' : null;
  if (!action) return;
  if (action === 'find') e.preventDefault();   // not the browser's own Ctrl-K
  try { window.parent.postMessage({ source: 'ccc-tool', action: action }, '*'); } catch (err) {}
});

// ============ AUTO-REFRESH SCHEDULER ============
// Watches for the day's new Sales Report upload: every 30 minutes from
// 9:00 AM to 11:30 AM (9:00, 9:30, 10:00, 10:30, 11:00, 11:30). If the TV
// was asleep or offline during the window, it catches up as soon as it
// wakes any time after 9 AM and still has yesterday's data. Press "R" to
// force a refresh at any time.
let lastAutoAttempt = 0;
function inRefreshWindow(d) {
  const m = d.getHours() * 60 + d.getMinutes();
  return m >= CONFIG.REFRESH_WINDOW.startMin && m <= CONFIG.REFRESH_WINDOW.endMin;
}
function autoRefreshTick() {
  if (Date.now() - lastAutoAttempt < 5 * 60 * 1000) return; // throttle retries
  const now = new Date();
  const windowOpen = new Date(now.getFullYear(), now.getMonth(), now.getDate(),
    Math.floor(CONFIG.REFRESH_WINDOW.startMin / 60), CONFIG.REFRESH_WINDOW.startMin % 60, 0);
  const stale = state.lastRefresh && now >= windowOpen && state.lastRefresh < windowOpen;
  const onCheckpoint = inRefreshWindow(now) && now.getMinutes() % CONFIG.REFRESH_WINDOW.everyMin === 0;
  if (onCheckpoint || stale) { lastAutoAttempt = Date.now(); loadData(); }
}
setInterval(autoRefreshTick, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) autoRefreshTick(); });

// "New data" toast — a broadcast "update" bar slides in from the left.
function showToast(msg) {
  const scaler = document.getElementById('stage-scaler');
  if (!scaler) return;
  let clean = String(msg);
  try { clean = clean.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]\uFE0F?\s*/gu, ''); } catch (e) {}
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = '<div class="tg">UPDATE</div><div class="tm">' + escHtml(clean.trim()) + '</div>';
  scaler.appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('show')));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 900); }, 7000);
}

// ============ INIT ============
window.addEventListener('resize', fitStage);
applyDayColor();
loadPersistedFilters();
fitStage();
wakeControls();
loadData();
scheduleDayColorAtMidnight();
</script>
